<!DOCTYPE html>
<html>
<head>
  <title>RDS Admin</title>
</head>
<body>

<h2>⚙️ ADMIN PANEL</h2>

<!-- ===================== -->
<!-- 🏪 BUSINESSES -->
<!-- ===================== -->
<h3>Add Business</h3>
<input id="bname" placeholder="Business name">
<button onclick="addBusiness()">Add</button>

<h3>Businesses</h3>
<div id="biz"></div>

<hr>

<!-- ===================== -->
<!-- 📦 PRODUCTS -->
<!-- ===================== -->
<h3>Add Product</h3>

<select id="bizSelect"></select>
<input id="pname" placeholder="Product name">
<input id="price" placeholder="Price">
<button onclick="addProduct()">Add Product</button>

<h3>Products</h3>
<div id="products"></div>

<pre id="out"></pre>

<script>
const API = "https://rds-lab.onrender.com";

/* ===================== */
/* INIT                  */
/* ===================== */
window.onload = load;

async function load(){
  try {
    await loadBusinesses();
    await loadProducts();
  } catch(e){
    console.error(e);
    safeOut("❌ Cannot connect to server");
  }
}

function safeOut(msg){
  const el = document.getElementById("out");
  if(el) el.innerText = msg;
}

/* ===================== */
/* BUSINESSES            */
/* ===================== */
async function loadBusinesses(){
  const r = await fetch(API + "/businesses");
  if(!r.ok) throw new Error("Failed businesses");

  const d = await r.json();

  let h = "";
  let options = "";

  (d.businesses || []).forEach(b=>{
    h += `${b.name} 
      <button onclick="delBiz('${b.id}')">Delete</button><br>`;

    options += `<option value="${b.id}">${b.name}</option>`;
  });

  document.getElementById("biz").innerHTML = h || "No businesses";
  document.getElementById("bizSelect").innerHTML = options;
}

async function addBusiness(){
  const name = document.getElementById("bname").value;

  const r = await fetch(API + "/addBusiness",{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body: JSON.stringify({name})
  });

  const d = await r.json();
  safeOut(JSON.stringify(d,null,2));

  document.getElementById("bname").value = "";
  load();
}

async function delBiz(id){
  await fetch(API + "/deleteBusiness",{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body: JSON.stringify({id})
  });

  load();
}

/* ===================== */
/* PRODUCTS              */
/* ===================== */
async function loadProducts(){
  const r = await fetch(API + "/products");
  if(!r.ok) throw new Error("Failed products");

  const d = await r.json();

  let h = "";

  (d.products || []).forEach(p=>{
    h += `${p.name} (${p.price}) 
      <button onclick="delProduct('${p.id}')">Delete</button><br>`;
  });

  document.getElementById("products").innerHTML = h || "No products";
}

async function addProduct(){
  const name = document.getElementById("pname").value;
  const price = document.getElementById("price").value;
  const businessId = document.getElementById("bizSelect").value;

  const r = await fetch(API + "/addProduct",{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body: JSON.stringify({name,price,businessId})
  });

  const d = await r.json();
  safeOut(JSON.stringify(d,null,2));

  document.getElementById("pname").value = "";
  document.getElementById("price").value = "";

  load();
}

async function delProduct(id){
  await fetch(API + "/deleteProduct",{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body: JSON.stringify({id})
  });

  load();
}
</script>

</body>
</html>
