<!DOCTYPE html>
<html>
<body>

<h2>⚙️ ADMIN PANEL</h2>

<!-- ===================== -->
<!-- 🏪 BUSINESSES -->
<!-- ===================== -->
<h3>Add Business</h3>
<input id="bname" placeholder="Business name">
<button onclick="addBusiness()">Add</button>

<h3>Businesses</h3>
<div id="biz"></div>

<hr>

<!-- ===================== -->
<!-- 📦 PRODUCTS -->
<!-- ===================== -->
<h3>Add Product</h3>

<select id="bizSelect"></select>
<input id="pname" placeholder="Product name">
<input id="price" placeholder="Price">
<button onclick="addProduct()">Add Product</button>

<h3>Products</h3>
<div id="products"></div>

<pre id="out"></pre>

<script>

/* ✅ FIXED: LIVE BACKEND URL */
const API = "https://rds-lab.onrender.com";

/* ===================== */
/* SAFE FETCH (handles slow backend) */
/* ===================== */
async function safeFetch(url, options){
  try{
    const r = await fetch(url, options);
    return await r.json();
  }catch(e){
    console.log("⚠️ Server waking up...");
    return {};
  }
}

/* ===================== */
/* LOAD ALL              */
/* ===================== */
async function load(){
  await loadBusinesses();
  await loadProducts();
}

/* ===================== */
/* BUSINESSES            */
/* ===================== */
async function loadBusinesses(){
  const d = await safeFetch(API + "/businesses");

  if(!d.businesses){
    document.getElementById("biz").innerHTML = "⏳ Loading...";
    return;
  }

  let h = "";
  let options = "";

  d.businesses.forEach(b=>{
    h += `
      ${b.name}
      <button onclick="delBiz('${b.id}')">Delete</button>
      <br>
    `;

    options += `<option value="${b.id}">${b.name}</option>`;
  });

  document.getElementById("biz").innerHTML = h;
  document.getElementById("bizSelect").innerHTML = options;
}

async function addBusiness(){
  const name = document.getElementById("bname").value;

  const d = await safeFetch(API + "/addBusiness",{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body: JSON.stringify({name})
  });

  document.getElementById("out").innerText = JSON.stringify(d,null,2);
  load();
}

async function delBiz(id){
  await safeFetch(API + "/deleteBusiness",{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body: JSON.stringify({id})
  });

  load();
}

/* ===================== */
/* PRODUCTS              */
/* ===================== */
async function loadProducts(){
  const d = await safeFetch(API + "/products");

  if(!d.products){
    document.getElementById("products").innerHTML = "⏳ Loading...";
    return;
  }

  let h = "";

  d.products.forEach(p=>{
    h += `
      ${p.name} (${p.price})
      <button onclick="delProduct('${p.id}')">Delete</button>
      <br>
    `;
  });

  document.getElementById("products").innerHTML = h;
}

async function addProduct(){
  const name = document.getElementById("pname").value;
  const price = document.getElementById("price").value;
  const businessId = document.getElementById("bizSelect").value;

  const d = await safeFetch(API + "/addProduct",{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body: JSON.stringify({name,price,businessId})
  });

  document.getElementById("out").innerText = JSON.stringify(d,null,2);
  load();
}

async function delProduct(id){
  await safeFetch(API + "/deleteProduct",{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body: JSON.stringify({id})
  });

  load();
}

/* INIT */
load();

</script>

</body>
</html>
