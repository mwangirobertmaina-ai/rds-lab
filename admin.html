<!DOCTYPE html>
<html>
<head>
  <title>RDS ADMIN</title>
  <style>
    body { font-family: monospace; background:#111; color:#0f0; padding:20px; }
    h2, h3 { color:#00ff66; }
    button { background:#0f0; border:none; padding:5px 10px; margin:3px; cursor:pointer; }
    .box { border:1px solid #0f0; padding:10px; margin-bottom:10px; }
    pre { background:#000; padding:10px; border:1px solid #333; color:#0f0; }
  </style>
</head>
<body>

<h2>⚙️ RDS ADMIN PANEL</h2>

<!-- ===================== -->
<!-- BUSINESSES -->
<!-- ===================== -->
<h3>🏪 Businesses</h3>

<input id="bname" placeholder="Business name">
<button onclick="addBusiness()">Add</button>

<div id="biz"></div>

<hr>

<!-- ===================== -->
<!-- PRODUCTS -->
<!-- ===================== -->
<h3>📦 Products</h3>

<select id="bizSelect"></select>
<input id="pname" placeholder="Product name">
<input id="price" placeholder="Price">
<button onclick="addProduct()">Add Product</button>

<div id="products"></div>

<hr>

<!-- ===================== -->
<!-- ORDERS -->
<!-- ===================== -->
<h3>🧾 Orders</h3>
<div id="orders"></div>

<hr>

<!-- ===================== -->
<!-- LEDGER -->
<!-- ===================== -->
<h3>📊 Ledger</h3>
<div id="ledger"></div>

<hr>

<!-- ===================== -->
<!-- WALLETS -->
<!-- ===================== -->
<h3>💼 Wallets</h3>
<div id="wallets"></div>

<pre id="out"></pre>

<script>
const API = "https://rds-lab.onrender.com";

/* ===================== */
/* LOAD ALL              */
/* ===================== */
async function load(){
  try {
    await loadBusinesses();
    await loadProducts();
    await loadOrders();
    await loadLedger();
    await loadWallets();
  } catch(e){
    console.error(e);
    document.getElementById("out").innerText = "❌ Server not reachable";
  }
}

/* ===================== */
/* BUSINESSES            */
/* ===================== */
async function loadBusinesses(){
  const r = await fetch(API + "/businesses");
  const d = await r.json();

  let h = "";
  let opt = "";

  (d.businesses || []).forEach(b=>{
    h += `${b.name} <button onclick="delBiz('${b.id}')">Delete</button><br>`;
    opt += `<option value="${b.id}">${b.name}</option>`;
  });

  document.getElementById("biz").innerHTML = h || "No businesses";
  document.getElementById("bizSelect").innerHTML = opt;
}

async function addBusiness(){
  const name = document.getElementById("bname").value;

  await fetch(API + "/addBusiness",{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body: JSON.stringify({name})
  });

  document.getElementById("bname").value = "";
  load();
}

async function delBiz(id){
  await fetch(API + "/deleteBusiness",{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body: JSON.stringify({id})
  });

  load();
}

/* ===================== */
/* PRODUCTS              */
/* ===================== */
async function loadProducts(){
  const r = await fetch(API + "/products");
  const d = await r.json();

  let h = "";

  (d.products || []).forEach(p=>{
    h += `${p.name} ($${p.price}) <button onclick="delProduct('${p.id}')">Delete</button><br>`;
  });

  document.getElementById("products").innerHTML = h || "No products";
}

async function addProduct(){
  const name = document.getElementById("pname").value;
  const price = document.getElementById("price").value;
  const businessId = document.getElementById("bizSelect").value;

  await fetch(API + "/addProduct",{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body: JSON.stringify({name,price,businessId})
  });

  document.getElementById("pname").value = "";
  document.getElementById("price").value = "";

  load();
}

async function delProduct(id){
  await fetch(API + "/deleteProduct",{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body: JSON.stringify({id})
  });

  load();
}

/* ===================== */
/* ORDERS                */
/* ===================== */
async function loadOrders(){
  const r = await fetch(API + "/ledger"); // using ledger to infer orders
  const d = await r.json();

  let h = "";

  (d.ledger || []).forEach(l=>{
    h += `
      <div class="box">
        ID: ${l.id}<br>
        Time: ${new Date(l.createdAt).toLocaleString()}
      </div>
    `;
  });

  document.getElementById("orders").innerHTML = h || "No orders yet";
}

/* ===================== */
/* LEDGER                */
/* ===================== */
async function loadLedger(){
  const r = await fetch(API + "/ledger");
  const d = await r.json();

  let h = "";

  (d.ledger || []).forEach(l=>{
    h += `<div class="box">`;

    l.entries.forEach(e=>{
      h += `
        ${e.account}
        ${e.debit ? "DR: " + e.debit : ""}
        ${e.credit ? "CR: " + e.credit : ""}
        <br>
      `;
    });

    h += `</div>`;
  });

  document.getElementById("ledger").innerHTML = h || "No ledger data";
}

/* ===================== */
/* WALLETS               */
/* ===================== */
async function loadWallets(){
  const r = await fetch(API + "/wallets");
  const d = await r.json();

  let h = "";

  (d.wallets || []).forEach(w=>{
    h += `
      <div class="box">
        Business: ${w.businessId}<br>
        Balance: $${w.balance}
      </div>
    `;
  });

  document.getElementById("wallets").innerHTML = h || "No wallets";
}

/* INIT */
load();
</script>

</body>
</html>
