<!DOCTYPE html>
<html>
<head>
  <title>RDS ADMIN</title>

  <style>
    body {
      font-family: monospace;
      background:#111;
      color:#0f0;
      padding:20px;
    }

    h2,h3 {
      color:#00ff66;
    }

    input, select {
      padding:5px;
      margin:5px;
      background:#000;
      color:#0f0;
      border:1px solid #0f0;
    }

    button {
      background:#0f0;
      color:#000;
      border:none;
      padding:6px 12px;
      margin:3px;
      cursor:pointer;
      font-weight:bold;
    }

    button:hover {
      background:#0c0;
    }

    .box {
      border:1px solid #0f0;
      padding:10px;
      margin-bottom:15px;
    }

    pre {
      background:#000;
      padding:10px;
      border:1px solid #333;
    }
  </style>
</head>

<body>

<h2>🛠 RDS ADMIN PANEL</h2>

<button onclick="loadAll()">🔄 Refresh</button>

<div class="box">
<h3>➕ Add Business</h3>
<input id="bname" placeholder="Business name">
<button onclick="addBusiness()">Add</button>
</div>

<div class="box">
<h3>🏪 Businesses</h3>
<div id="biz"></div>
</div>

<div class="box">
<h3>➕ Add Product</h3>
<select id="bizSelect"></select>
<input id="pname" placeholder="Product name">
<input id="price" placeholder="Price">
<button onclick="addProduct()">Add Product</button>
</div>

<div class="box">
<h3>📦 Products</h3>
<div id="products"></div>
</div>

<div class="box">
<h3>📦 Orders</h3>
<div id="orders"></div>
</div>

<div class="box">
<h3>📊 Ledger</h3>
<div id="ledger"></div>
</div>

<div class="box">
<h3>💰 Wallets</h3>
<div id="wallets"></div>
</div>

<h3>📡 Output</h3>
<pre id="out"></pre>

<script>
const API = "https://rds-lab.onrender.com";

/* ===================== */
/* MAIN LOAD             */
/* ===================== */
async function loadAll(){
  try {
    out("Loading system...");

    await loadBusinesses();
    await loadProducts();
    await loadOrders();
    await loadLedger();
    await loadWallets();

    out("✅ System ready");

  } catch(e){
    console.error(e);
    out("❌ Cannot connect (server sleeping)");
  }
}

function out(msg){
  document.getElementById("out").innerText = msg;
}

/* ===================== */
/* BUSINESSES            */
/* ===================== */
async function loadBusinesses(){
  const r = await fetch(API + "/businesses");
  const d = await r.json();

  let h = "";
  let options = "";

  (d.businesses || []).forEach(b=>{
    h += `
      ${b.name}
      <button onclick="delBiz('${b.id}')">Delete</button>
      <br>
    `;

    options += `<option value="${b.id}">${b.name}</option>`;
  });

  document.getElementById("biz").innerHTML = h || "No businesses";
  document.getElementById("bizSelect").innerHTML = options;
}

async function addBusiness(){
  const name = document.getElementById("bname").value;

  if(!name) return out("Enter business name");

  const r = await fetch(API + "/addBusiness",{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body: JSON.stringify({name})
  });

  const d = await r.json();
  out(JSON.stringify(d,null,2));

  document.getElementById("bname").value = "";
  loadAll();
}

async function delBiz(id){
  await fetch(API + "/deleteBusiness",{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body: JSON.stringify({id})
  });

  loadAll();
}

/* ===================== */
/* PRODUCTS              */
/* ===================== */
async function loadProducts(){
  const r = await fetch(API + "/products");
  const d = await r.json();

  let h = "";

  (d.products || []).forEach(p=>{
    h += `
      ${p.name} ($${p.price})
      <button onclick="delProduct('${p.id}')">Delete</button>
      <br>
    `;
  });

  document.getElementById("products").innerHTML = h || "No products";
}

async function addProduct(){
  const name = document.getElementById("pname").value;
  const price = document.getElementById("price").value;
  const businessId = document.getElementById("bizSelect").value;

  if(!name || !price || !businessId){
    return out("Fill all fields");
  }

  const r = await fetch(API + "/addProduct",{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body: JSON.stringify({name,price,businessId})
  });

  const d = await r.json();
  out(JSON.stringify(d,null,2));

  document.getElementById("pname").value = "";
  document.getElementById("price").value = "";

  loadAll();
}

async function delProduct(id){
  await fetch(API + "/deleteProduct",{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body: JSON.stringify({id})
  });

  loadAll();
}

/* ===================== */
/* ORDERS                */
/* ===================== */
async function loadOrders(){
  const r = await fetch(API + "/orders");
  const d = await r.json();

  let h = "";

  (d.orders || []).forEach(o=>{
    h += `Order ${o.id} → $${o.total}<br>`;
  });

  document.getElementById("orders").innerHTML = h || "No orders";
}

/* ===================== */
/* LEDGER                */
/* ===================== */
async function loadLedger(){
  const r = await fetch(API + "/ledger");
  const d = await r.json();

  let h = "";

  (d.ledger || []).forEach(l=>{
    h += `<b>${l.id}</b><br>`;

    l.entries.forEach(e=>{
      h += `
        ${e.account}
        D:${e.debit || 0}
        C:${e.credit || 0}
        ${e.businessId ? " | B:" + e.businessId : ""}
        <br>
      `;
    });

    h += "<hr>";
  });

  document.getElementById("ledger").innerHTML = h || "No ledger";
}

/* ===================== */
/* WALLETS               */
/* ===================== */
async function loadWallets(){
  const r = await fetch(API + "/wallets");
  const d = await r.json();

  let h = "";

  (d.wallets || []).forEach(w=>{
    h += `
      Business ${w.businessId}
      → Balance: $${w.balance}
      <br>
    `;
  });

  document.getElementById("wallets").innerHTML = h || "No wallets";
}

/* INIT */
loadAll();
</script>

</body>
</html>
