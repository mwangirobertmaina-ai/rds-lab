<!DOCTYPE html>
<html>
<head>
  <title>RDS MARKET</title>
  <style>
    body { font-family: monospace; background:#111; color:#0f0; padding:20px; }
    .card { border:1px solid #0f0; margin:10px; padding:10px; }
    button { background:#0f0; border:none; padding:5px 10px; cursor:pointer; font-weight:bold; }
    button:hover { background:#0c0; }
    pre { background:#000; padding:10px; border:1px solid #333; }
  </style>
</head>
<body>

<h2>🛒 RDS MARKET</h2>

<div id="catalog">Loading products...</div>

<h3>🛒 Cart</h3>
<div id="cart">Empty</div>
Total: $<span id="total">0</span><br><br>

<button onclick="checkout()">Checkout</button>

<pre id="out"></pre>

<script>
const API = "https://rds-lab.onrender.com";

let products = [];
let cart = {};

/* ===================== */
/* LOAD PRODUCTS         */
/* ===================== */
async function init(){
  try {
    document.getElementById("catalog").innerText = "⏳ Loading from server...";

    const r = await fetch(API + "/products");
    const d = await r.json();

    if (!d.success || !d.products) throw "API error";

    products = d.products;
    renderProducts();

  } catch(e){
    document.getElementById("catalog").innerText =
      "❌ Cannot reach server (wait 5s then refresh)";
  }
}

/* ===================== */
/* RENDER PRODUCTS       */
/* ===================== */
function renderProducts(){
  if (products.length === 0) {
    document.getElementById("catalog").innerText =
      "No products available. Add from admin panel.";
    return;
  }

  let html = "";

  products.forEach(p=>{
    html += `
      <div class="card">
        ${p.name} - $${p.price}
        <button onclick="add('${p.id}')">Add</button>
      </div>
    `;
  });

  document.getElementById("catalog").innerHTML = html;
}

/* ===================== */
/* CART                  */
/* ===================== */
function add(id){
  cart[id] = (cart[id] || 0) + 1;
  renderCart();
}

function remove(id){
  if (!cart[id]) return;

  cart[id]--;
  if (cart[id] <= 0) delete cart[id];

  renderCart();
}

function renderCart(){
  let html = "";
  let total = 0;

  Object.keys(cart).forEach(id=>{
    const p = products.find(x => x.id === id);
    if (!p) return;

    const qty = cart[id];
    const t = p.price * qty;
    total += t;

    html += `
      ${p.name} x${qty} = $${t}
      <button onclick="add('${id}')">+</button>
      <button onclick="remove('${id}')">-</button>
      <br>
    `;
  });

  document.getElementById("cart").innerHTML = html || "Empty";
  document.getElementById("total").innerText = total;
}

/* ===================== */
/* CHECKOUT              */
/* ===================== */
async function checkout(){
  const out = document.getElementById("out");

  if (Object.keys(cart).length === 0) {
    out.innerText = "❌ Cart is empty";
    return;
  }

  out.innerText = "⏳ Processing order...";

  try {
    for (let id of Object.keys(cart)) {

      const res = await fetch(API + "/order", {
        method:"POST",
        headers:{ "Content-Type":"application/json" },
        body: JSON.stringify({
          productId: id,
          qty: cart[id]
        })
      });

      const d = await res.json();

      if (!d.success) {
        throw "Order failed for product " + id;
      }
    }

    out.innerText = "✅ SUCCESS\nLedger + Wallet updated";

    cart = {};
    renderCart();

  } catch(e){
    console.error(e);
    out.innerText = "❌ Failed: server may be sleeping (retry)";
  }
}

/* INIT */
init();
</script>

</body>
</html>
