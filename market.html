<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#000000">
  <title>RDS HYBRID MARKETPLACE</title>
  <style>
    :root {
      --neon-green: #00ff88;
      --dark-bg: #000000;
      --panel-bg: #111111;
      --text-dim: #888888;
      --cyan: #00e5ff;
      --gold: #ffd700;
    }
    * { box-sizing: border-box; touch-action: manipulation; }
    body {
      background: var(--dark-bg);
      color: var(--neon-green);
      font-family: monospace;
      padding: 12px;
      margin: 0;
    }
    h2 { margin: 0 0 10px 0; font-size: 1.2rem; }
    .box {
      border: 1px solid var(--neon-green);
      border-radius: 6px;
      padding: 12px;
      margin-bottom: 12px;
      background: var(--panel-bg);
    }
    button {
      padding: 10px 14px;
      background: var(--neon-green);
      color: #000;
      font-weight: bold;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-family: monospace;
    }
    .product-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
      gap: 10px;
      margin-top: 10px;
    }
    .product-card {
      border: 1px solid #333;
      padding: 10px;
      background: #181818;
      border-radius: 4px;
      text-align: center;
    }
    input {
      width: 100%;
      padding: 10px;
      background: #111;
      color: var(--neon-green);
      border: 1px solid var(--neon-green);
      border-radius: 4px;
      margin-bottom: 8px;
      font-family: monospace;
    }
    .cart-item {
      display: flex;
      justify-content: space-between;
      border-bottom: 1px solid #222;
      padding: 6px 0;
    }
  </style>
</head>
<body>

<h2>🛒 RDS CUSTOMER MARKETPLACE</h2>

<div class="box">
  <label><strong>Select Merchant Store:</strong></label>
  <select id="shopSelect" onchange="loadProducts()" style="width:100%; padding:8px; background:#111; color:#00ff88; border:1px solid #00ff88; margin-top:5px;"></select>
</div>

<div class="box">
  <strong>📦 Available Inventory</strong>
  <div id="productCatalog" class="product-grid"><em>Loading inventory...</em></div>
</div>

<div class="box">
  <strong>🛍️ Shopping Cart</strong>
  <div id="cartList" style="margin-top:8px;"><em>Cart is empty.</em></div>
  <h3 id="cartTotal" style="margin:10px 0 5px 0;">Total: $0.00</h3>
  <input type="text" id="custName" placeholder="Your Name (e.g. Robert)" value="Robert" />
  <input type="text" id="custPhone" placeholder="Phone Number" value="0712345678" />
  <button onclick="checkout()" style="width:100%; background:var(--gold);">⚡ Place Order & Request Driver</button>
</div>

<div class="box">
  <strong>📡 Order Tracker Status</strong>
  <p id="orderStatus">No active orders placed.</p>
</div>

<script>
const LOCAL_API = "http://localhost:3000";
const CLOUD_API = "https://rds-lab.onrender.com";
let API_BASE = window.location.origin.includes("localhost") ? LOCAL_API : CLOUD_API;

let cart = [];

async function apiFetch(ep, opts = {}) {
  try {
    const res = await fetch(`${API_BASE}${ep}`, {
      ...opts,
      headers: { "Content-Type": "application/json", ...(opts.headers || {}) }
    });
    return await res.json();
  } catch (e) { return null; }
}

async function loadShops() {
  const data = await apiFetch("/businesses");
  const select = document.getElementById("shopSelect");
  select.innerHTML = "";
  const list = (data && data.businesses) || [];
  if (list.length === 0) {
    select.innerHTML = "<option value='BIZ-001'>Caro Supermarket (Default)</option>";
  } else {
    list.forEach(b => {
      select.innerHTML += `<option value="${b.id}">${b.name} (${b.category || 'Retail'})</option>`;
    });
  }
  loadProducts();
}

async function loadProducts() {
  const bizId = document.getElementById("shopSelect").value || "BIZ-001";
  const data = await apiFetch(`/products?businessId=${bizId}`);
  const grid = document.getElementById("productCatalog");
  
  let products = (data && data.products) || [];
  if (products.length === 0) {
    products = [
      { id: "P-101", name: "Fresh Milk 1L", price: 2.50 },
      { id: "P-102", name: "Loaf of Bread", price: 1.80 },
      { id: "P-103", name: "Bottled Water 500ml", price: 0.90 }
    ];
  }

  grid.innerHTML = "";
  products.forEach(p => {
    grid.innerHTML += `
      <div class="product-card">
        <b>${p.name}</b><br>
        <span style="color:var(--cyan)">$${p.price.toFixed(2)}</span><br><br>
        <button onclick="addToCart('${p.name}', ${p.price})"> Add</button>
      </div>
    `;
  });
}

function addToCart(name, price) {
  cart.push({ name, price });
  renderCart();
}

function renderCart() {
  const container = document.getElementById("cartList");
  if (cart.length === 0) {
    container.innerHTML = "<em>Cart is empty.</em>";
    document.getElementById("cartTotal").innerText = "Total: $0.00";
    return;
  }
  
  let html = "";
  let total = 0;
  cart.forEach((item, index) => {
    total += item.price;
    html += `
      <div class="cart-item">
        <span>${item.name}</span>
        <span>$${item.price.toFixed(2)}</span>
      </div>
    `;
  });
  container.innerHTML = html;
  document.getElementById("cartTotal").innerText = `Total: $${total.toFixed(2)}`;
}

async function checkout() {
  if (cart.length === 0) return alert("Your cart is empty!");
  const name = document.getElementById("custName").value.trim() || "Guest";
  const phone = document.getElementById("custPhone").value.trim() || "0700000000";
  const total = cart.reduce((sum, item) => sum + item.price, 0);

  document.getElementById("orderStatus").innerText = "⏳ Creating order and requesting nearby driver...";

  const res = await apiFetch("/order/create", {
    method: "POST",
    body: JSON.stringify({ customerName: name, customerPhone: phone, amount: total, items: cart })
  });

  if (res && res.success) {
    const orderId = res.order.id;
    document.getElementById("orderStatus").innerText = `✅ Order ${orderId} created! Auto-dispatching driver...`;
    
    // Trigger spatial auto-dispatch
    const dispatchRes = await apiFetch("/dispatch/auto", {
      method: "POST",
      body: JSON.stringify({ orderId })
    });

    if (dispatchRes && dispatchRes.success) {
      document.getElementById("orderStatus").innerText = `🚚 Order ${orderId} assigned to driver! Tracking live...`;
      cart = [];
      renderCart();
    }
  }
}

window.onload = () => {
  loadShops();
};
</script>
</body>
</html>
