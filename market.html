<!DOCTYPE html>
<html>
<head>
  <title>RDS Market</title>
</head>
<body>

<h2>🛒 RDS MARKET</h2>

<button onclick="load()">🔄 Load Shops & Products</button>

<h3>🏪 Shops</h3>
<div id="shops"></div>

<h3>📦 Products</h3>
<div id="products"></div>

<h3>🛒 Cart</h3>
<div id="cart"></div>

<button onclick="checkout()">💳 Checkout</button>

<pre id="out"></pre>

<script>
const API = "https://rds-lab.onrender.com";

let PRODUCTS = [];
let CART = [];

/* ===================== */
/* LOAD                  */
/* ===================== */
async function load(){
  try {
    const b = await fetch(API + "/businesses").then(r=>r.json());
    const p = await fetch(API + "/products").then(r=>r.json());

    PRODUCTS = p.products || [];

    showShops(b.businesses || []);
    showProducts(PRODUCTS);

  } catch(e){
    console.error(e);
    out("❌ Cannot load data");
  }
}

function out(msg){
  document.getElementById("out").innerText = msg;
}

/* ===================== */
/* SHOPS                 */
/* ===================== */
function showShops(list){
  let h = "";

  list.forEach(b=>{
    h += `${b.name}<br>`;
  });

  document.getElementById("shops").innerHTML = h || "No shops";
}

/* ===================== */
/* PRODUCTS              */
/* ===================== */
function showProducts(list){
  let h = "";

  list.forEach(p=>{
    h += `
      ${p.name} - ${p.price}
      <button onclick="addToCart('${p.id}')">Add</button>
      <br>
    `;
  });

  document.getElementById("products").innerHTML = h || "No products";
}

/* ===================== */
/* CART                  */
/* ===================== */
function addToCart(id){
  const p = PRODUCTS.find(x=>x.id === id);

  const found = CART.find(x=>x.id === id);

  if(found){
    found.qty++;
  } else {
    CART.push({...p, qty:1});
  }

  renderCart();
}

function renderCart(){
  let h = "";
  let total = 0;

  CART.forEach(i=>{
    const t = i.price * i.qty;
    total += t;

    h += `
      ${i.name} x ${i.qty} = ${t}
      <button onclick="removeItem('${i.id}')">X</button>
      <br>
    `;
  });

  h += `<b>Total: ${total}</b>`;

  document.getElementById("cart").innerHTML = h || "Cart empty";
}

function removeItem(id){
  CART = CART.filter(x=>x.id !== id);
  renderCart();
}

/* ===================== */
/* CHECKOUT              */
/* ===================== */
async function checkout(){
  if(CART.length === 0){
    out("Cart empty");
    return;
  }

  try {
    for(let item of CART){
      await fetch(API + "/order",{
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body: JSON.stringify({
          productId: item.id,
          qty: item.qty
        })
      });
    }

    out("✅ Order placed!");

    CART = [];
    renderCart();

  } catch(e){
    console.error(e);
    out("❌ Checkout failed");
  }
}

/* INIT */
load();
</script>

</body>
</html>
