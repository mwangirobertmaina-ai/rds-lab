<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>RDS MARKET</title>

<style>
body {
  font-family: monospace;
  background:#111;
  color:#0f0;
  padding:20px;
}

h2,h3 {
  color:#00ff66;
}

button {
  background:#0f0;
  color:#000;
  font-weight:bold;
  border:none;
  padding:6px 12px;
  margin:3px;
  cursor:pointer;
}

button:hover {
  background:#0c0;
}

.section {
  border:1px solid #0f0;
  padding:10px;
  margin-bottom:15px;
}

pre {
  background:#000;
  padding:10px;
  border:1px solid #333;
}
</style>

</head>
<body>

<h2>🛒 RDS MARKET (LIVE)</h2>

<button onclick="load()">🔄 Refresh System</button>

<div class="section">
<h3>🏪 Shops</h3>
<div id="shops">Loading...</div>
</div>

<div class="section">
<h3>📦 Products</h3>
<div id="products"></div>
</div>

<div class="section">
<h3>🛒 Cart</h3>
<div id="cart"></div>
</div>

<button onclick="checkout()">💳 Checkout</button>

<div class="section">
<h3>📦 Orders</h3>
<div id="orders"></div>
</div>

<div class="section">
<h3>📊 Ledger</h3>
<div id="ledger"></div>
</div>

<div class="section">
<h3>💰 Wallets</h3>
<div id="wallets"></div>
</div>

<h3>📡 System Output</h3>
<pre id="out"></pre>

<script>
const API = "https://rds-lab.onrender.com";

let PRODUCTS = [];
let CART = [];

/* ===================== */
/* LOAD ALL DATA         */
/* ===================== */
async function load(){
  try {
    out("Loading system...");

    const b = await fetch(API + "/businesses").then(r=>r.json());
    const p = await fetch(API + "/products").then(r=>r.json());

    PRODUCTS = p.products || [];

    showShops(b.businesses || []);
    showProducts(PRODUCTS);

    await loadOrders();
    await loadLedger();
    await loadWallets();

    out("✅ System loaded");

  } catch(e){
    console.error(e);
    out("❌ Cannot connect (server may be sleeping)");
  }
}

function out(msg){
  document.getElementById("out").innerText = msg;
}

/* ===================== */
/* SHOPS                 */
/* ===================== */
function showShops(list){
  let h = "";

  list.forEach(b=>{
    h += `${b.name}<br>`;
  });

  document.getElementById("shops").innerHTML = h || "No shops";
}

/* ===================== */
/* PRODUCTS              */
/* ===================== */
function showProducts(list){
  let h = "";

  list.forEach(p=>{
    h += `
      ${p.name} - $${p.price}
      <button onclick="addToCart('${p.id}')">Add</button>
      <br>
    `;
  });

  document.getElementById("products").innerHTML = h || "No products";
}

/* ===================== */
/* CART                  */
/* ===================== */
function addToCart(id){
  const p = PRODUCTS.find(x=>x.id === id);
  if (!p) return;

  const found = CART.find(x=>x.id === id);

  if(found){
    found.qty++;
  } else {
    CART.push({ id:p.id, name:p.name, price:p.price, qty:1 });
  }

  renderCart();
}

function renderCart(){
  let h = "";
  let total = 0;

  CART.forEach(i=>{
    const t = i.price * i.qty;
    total += t;

    h += `
      ${i.name} x ${i.qty} = $${t}
      <button onclick="removeItem('${i.id}')">X</button>
      <br>
    `;
  });

  if (CART.length > 0) {
    h += `<br><b>Total: $${total}</b>`;
  }

  document.getElementById("cart").innerHTML = h || "Cart empty";
}

function removeItem(id){
  CART = CART.filter(x=>x.id !== id);
  renderCart();
}

/* ===================== */
/* CHECKOUT              */
/* ===================== */
async function checkout(){
  if(CART.length === 0){
    out("Cart empty");
    return;
  }

  out("Processing transaction...");

  try {
    for (let item of CART) {
      const res = await fetch(API + "/order", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          productId: item.id,
          qty: item.qty
        })
      });

      const d = await res.json();

      if (!d.success) {
        throw new Error("Order failed");
      }
    }

    out("✅ SUCCESS → Ledger updated + Wallet credited");

    CART = [];
    renderCart();

    await load(); // reload everything

  } catch(e){
    console.error(e);
    out("❌ Checkout failed (server sleeping or error)");
  }
}

/* ===================== */
/* ORDERS                */
/* ===================== */
async function loadOrders(){
  const r = await fetch(API + "/orders").then(r=>r.json());

  let h = "";

  (r.orders || []).forEach(o=>{
    h += `Order ${o.id} → $${o.total}<br>`;
  });

  document.getElementById("orders").innerHTML = h || "No orders";
}

/* ===================== */
/* LEDGER                */
/* ===================== */
async function loadLedger(){
  const r = await fetch(API + "/ledger").then(r=>r.json());

  let h = "";

  (r.ledger || []).forEach(l=>{
    h += `<b>${l.id}</b><br>`;

    l.entries.forEach(e=>{
      h += `
        ${e.account}
        D:${e.debit || 0}
        C:${e.credit || 0}
        ${e.businessId ? " | B:" + e.businessId : ""}
        <br>
      `;
    });

    h += "<hr>";
  });

  document.getElementById("ledger").innerHTML = h || "No ledger entries";
}

/* ===================== */
/* WALLETS               */
/* ===================== */
async function loadWallets(){
  const r = await fetch(API + "/wallets").then(r=>r.json());

  let h = "";

  (r.wallets || []).forEach(w=>{
    h += `
      Business ${w.businessId}
      → Balance: $${w.balance}
      <br>
    `;
  });

  document.getElementById("wallets").innerHTML = h || "No wallets";
}

/* INIT */
load();
</script>

</body>
</html>
