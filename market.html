<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>RDS Market</title>
</head>
<body>

<h2>🛒 RDS MARKET</h2>

<button onclick="load()">🔄 Load Shops & Products</button>

<h3>🏪 Shops</h3>
<div id="shops"></div>

<h3>📦 Products</h3>
<div id="products"></div>

<h3>🛒 Cart</h3>
<div id="cart"></div>

<button onclick="checkout()">💳 Checkout</button>

<pre id="out"></pre>

<script>
const API = "https://rds-lab.onrender.com";

let PRODUCTS = [];
let CART = [];

/* ===================== */
/* LOAD DATA             */
/* ===================== */
async function load(){
  try {
    out("Loading...");

    const b = await fetch(API + "/businesses").then(r=>r.json());
    const p = await fetch(API + "/products").then(r=>r.json());

    PRODUCTS = p.products || [];

    showShops(b.businesses || []);
    showProducts(PRODUCTS);

    out("");

  } catch(e){
    console.error(e);
    out("❌ Cannot load data (server sleeping or offline)");
  }
}

function out(msg){
  document.getElementById("out").innerText = msg;
}

/* ===================== */
/* SHOW SHOPS            */
/* ===================== */
function showShops(list){
  let h = "";
  list.forEach(b=>{
    h += `${b.name}<br>`;
  });
  document.getElementById("shops").innerHTML = h || "No shops";
}

/* ===================== */
/* SHOW PRODUCTS         */
/* ===================== */
function showProducts(list){
  let h = "";

  list.forEach(p=>{
    h += `
      ${p.name} - $${p.price}
      <button onclick="addToCart('${p.id}')">Add</button>
      <br>
    `;
  });

  document.getElementById("products").innerHTML = h || "No products";
}

/* ===================== */
/* CART                  */
/* ===================== */
function addToCart(id){
  const p = PRODUCTS.find(x=>x.id === id);
  if (!p) return;

  const found = CART.find(x=>x.id === id);

  if(found){
    found.qty++;
  } else {
    CART.push({...p, qty:1});
  }

  renderCart();
}

function renderCart(){
  let h = "";
  let total = 0;

  CART.forEach(i=>{
    const t = i.price * i.qty;
    total += t;

    h += `
      ${i.name} x ${i.qty} = $${t}
      <button onclick="removeItem('${i.id}')">X</button>
      <br>
    `;
  });

  if (CART.length > 0) {
    h += `<br><b>Total: $${total}</b>`;
  }

  document.getElementById("cart").innerHTML = h || "Cart empty";
}

function removeItem(id){
  CART = CART.filter(x=>x.id !== id);
  renderCart();
}

/* ===================== */
/* CHECKOUT (FIXED)      */
/* ===================== */
async function checkout(){
  if(CART.length === 0){
    out("Cart empty");
    return;
  }

  out("Processing...");

  try {
    for (let item of CART) {

      const res = await fetch(API + "/order", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          productId: item.id,
          qty: item.qty
        })
      });

      const d = await res.json();

      if (!d.success) {
        throw new Error(d.error || "Order failed");
      }
    }

    out("✅ SUCCESS\nLedger updated + Wallet credited");

    CART = [];
    renderCart();

  } catch(e){
    console.error(e);
    out("❌ Checkout failed (server sleeping or error)");
  }
}

/* INIT */
load();
</script>

</body>
</html>
