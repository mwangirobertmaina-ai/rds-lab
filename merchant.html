<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RDS Sovereign Multi-Tenant Merchant Hub</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen font-sans">

    <!-- Top Navigation Header -->
    <header class="bg-slate-900 border-b border-slate-800 px-6 py-4 flex justify-between items-center shadow-lg">
        <div class="flex items-center space-x-3">
            <div class="bg-emerald-500 text-slate-950 p-2 rounded-lg font-black text-xl"><i class="fa-solid fa-store"></i></div>
            <div>
                <h1 id="shopTitle" class="text-xl font-bold tracking-wide text-emerald-400">RDS Multi-Tenant Hub</h1>
                <p id="shopVertical" class="text-xs text-slate-400">Vertical: Loading...</p>
            </div>
        </div>
        <div class="flex items-center space-x-4">
            <span id="merchantIdBadge" class="bg-slate-800 text-emerald-400 text-xs px-3 py-1 rounded-full font-mono border border-emerald-500/30">ID: Loading...</span>
            <button onclick="logoutMerchant()" class="bg-rose-600/20 hover:bg-rose-600 text-rose-400 hover:text-white px-3 py-1.5 rounded-lg text-sm transition border border-rose-500/30">
                <i class="fa-solid fa-power-off mr-1"></i> Logout
            </button>
        </div>
    </header>

    <main class="max-w-7xl mx-auto p-6 grid grid-cols-1 lg:grid-cols-3 gap-6">
        
        <!-- Left Column: Add / Update Product Form with Camera & Upload Support -->
        <section class="bg-slate-900 border border-slate-800 rounded-2xl p-6 shadow-xl lg:col-span-1 h-fit">
            <h2 class="text-lg font-semibold mb-4 text-emerald-400 flex items-center">
                <i class="fa-solid fa-circle-plus mr-2"></i> Add / Update Tenant Item
            </h2>
            
            <form id="catalogForm" onsubmit="handleCatalogUpdate(event)" class="space-y-4">
                <div>
                    <label class="block text-xs uppercase tracking-wider text-slate-400 mb-1">Product / Service Name</label>
                    <input type="text" id="itemName" required placeholder="e.g. Sovereign Organic Milk or Heavy Duty Pads" 
                        class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:border-emerald-500">
                </div>

                <div>
                    <label class="block text-xs uppercase tracking-wider text-slate-400 mb-1">Tenant Vertical Category</label>
                    <select id="itemCategory" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:border-emerald-500">
                        <option value="SUPERMARKET">Supermarket & Groceries</option>
                        <option value="HOTEL">Hotel & Accommodation</option>
                        <option value="AUTO_SPARE">Auto Spares & Hardware</option>
                        <option value="RETAIL_SHOP">General Retail Shop</option>
                    </select>
                </div>

                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs uppercase tracking-wider text-slate-400 mb-1">Price (KES)</label>
                        <input type="number" id="itemPrice" required placeholder="180" 
                            class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:border-emerald-500">
                    </div>
                    <div>
                        <label class="block text-xs uppercase tracking-wider text-slate-400 mb-1">Stock Qty / Units</label>
                        <input type="number" id="itemStock" required value="50" 
                            class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:border-emerald-500">
                    </div>
                </div>

                <!-- Image Source Options: URL, File Upload, or Camera Snapshot -->
                <div class="space-y-2">
                    <label class="block text-xs uppercase tracking-wider text-slate-400">Product Image Source</label>
                    
                    <div class="flex space-x-2">
                        <button type="button" onclick="switchImageMode('url')" id="btnModeUrl" class="flex-1 bg-emerald-500 text-slate-950 text-xs font-bold py-1.5 rounded-lg">Image URL</button>
                        <button type="button" onclick="switchImageMode('file')" id="btnModeFile" class="flex-1 bg-slate-800 text-slate-300 text-xs py-1.5 rounded-lg">Upload File</button>
                        <button type="button" onclick="switchImageMode('camera')" id="btnModeCamera" class="flex-1 bg-slate-800 text-slate-300 text-xs py-1.5 rounded-lg">Snap Camera</button>
                    </div>

                    <!-- Input 1: URL -->
                    <div id="imageInputUrlContainer">
                        <input type="url" id="itemImage" placeholder="https://images.unsplash.com/..." 
                            class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-2 text-sm focus:outline-none focus:border-emerald-500">
                    </div>

                    <!-- Input 2: File Upload -->
                    <div id="imageInputFileContainer" class="hidden">
                        <input type="file" id="itemImageFile" accept="image/*" onchange="encodeFileToBase64(this)"
                            class="w-full bg-slate-950 border border-slate-800 rounded-xl px-2 py-1.5 text-xs text-slate-400 file:mr-4 file:py-1 file:px-3 file:rounded-lg file:border-0 file:text-xs file:font-semibold file:bg-emerald-500 file:text-slate-950 hover:file:bg-emerald-400">
                    </div>

                    <!-- Input 3: Camera Capture -->
                    <div id="imageInputCameraContainer" class="hidden space-y-2">
                        <div class="relative bg-black rounded-xl overflow-hidden border border-slate-800 flex justify-center">
                            <video id="cameraStream" autoplay playsinline class="w-full h-36 object-cover"></video>
                            <canvas id="cameraCanvas" class="hidden"></canvas>
                        </div>
                        <button type="button" onclick="captureCameraSnapshot()" class="w-full bg-sky-600 hover:bg-sky-500 text-white font-semibold py-1.5 rounded-xl text-xs transition">
                            <i class="fa-solid fa-camera mr-1"></i> Capture Snapshot
                        </button>
                    </div>
                    
                    <!-- Hidden field storing the final base64 or URL string -->
                    <input type="hidden" id="finalImageValue" value="">
                </div>

                <button type="submit" class="w-full bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-bold py-3 rounded-xl transition shadow-lg shadow-emerald-500/20">
                    <i class="fa-solid fa-cloud-arrow-up mr-2"></i> Publish to Tenant Store
                </button>
            </form>
        </section>

        <!-- Right Column: Live Tenant Inventory Display -->
        <section class="bg-slate-900 border border-slate-800 rounded-2xl p-6 shadow-xl lg:col-span-2">
            <div class="flex justify-between items-center mb-4">
                <h2 class="text-lg font-semibold text-emerald-400 flex items-center">
                    <i class="fa-solid fa-boxes-stacked mr-2"></i> Active Tenant Inventory Catalog
                </h2>
                <button onclick="loadCatalog()" class="bg-slate-800 hover:bg-slate-700 text-xs px-3 py-1.5 rounded-lg border border-slate-700 transition">
                    <i class="fa-solid fa-rotate mr-1"></i> Refresh
                </button>
            </div>

            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="border-b border-slate-800 text-xs text-slate-400 uppercase tracking-wider">
                            <th class="py-3 px-4">Item Name</th>
                            <th class="py-3 px-4">Category</th>
                            <th class="py-3 px-4">Price (KES)</th>
                            <th class="py-3 px-4">Stock</th>
                            <th class="py-3 px-4 text-right">Actions</th>
                        </tr>
                    </thead>
                    <tbody id="catalogTableBody" class="divide-y divide-slate-800 text-sm">
                        <tr>
                            <td colspan="5" class="py-6 text-center text-slate-500">Loading tenant catalog...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </section>

    </main>

    <script>
        let currentMerchantId = localStorage.getItem('rds_merchantId') || 'MERCH_DEF_172';
        let mediaStream = null;

        async function loadCatalog() {
            try {
                const res = await fetch(`/api/merchant/catalog/${currentMerchantId}`);
                const data = await res.json();
                
                if (data.success && data.profile) {
                    document.getElementById('shopTitle').innerText = data.profile.shopName;
                    document.getElementById('shopVertical').innerText = `Vertical Corridor: ${data.profile.businessType}`;
                    document.getElementById('merchantIdBadge').innerText = `ID: ${currentMerchantId}`;
                }

                const tbody = document.getElementById('catalogTableBody');
                if (!data.success || !data.catalog || data.catalog.length === 0) {
                    tbody.innerHTML = `<tr><td colspan="5" class="py-6 text-center text-slate-500">No active items in tenant catalog yet.</td></tr>`;
                    return;
                }

                tbody.innerHTML = data.catalog.map(item => `
                    <tr class="hover:bg-slate-800/50 transition">
                        <td class="py-3 px-4 font-medium text-slate-200 flex items-center space-x-3">
                            <img src="${item.image || 'https://images.unsplash.com/photo-1550583724-b2692b85b150?w=100'}" class="w-10 h-10 rounded-lg object-cover border border-slate-800">
                            <span>${item.name}</span>
                        </td>
                        <td class="py-3 px-4"><span class="bg-slate-800 text-slate-300 text-xs px-2 py-1 rounded border border-slate-700">${item.category}</span></td>
                        <td class="py-3 px-4 text-emerald-400 font-semibold">KES ${Number(item.price).toLocaleString()}</td>
                        <td class="py-3 px-4"><span class="bg-emerald-500/10 text-emerald-400 px-2 py-0.5 rounded text-xs border border-emerald-500/20">${item.stock} Units</span></td>
                        <td class="py-3 px-4 text-right">
                            <button onclick="deleteItem('${item.id}')" class="text-rose-400 hover:text-rose-300 text-xs bg-rose-500/10 px-2.5 py-1 rounded border border-rose-500/20 transition">Delete</button>
                        </td>
                    </tr>
                `).join('');
            } catch (err) {
                console.error("Failed to load catalog:", err);
            }
        }

        function switchImageMode(mode) {
            document.getElementById('imageInputUrlContainer').classList.toggle('hidden', mode !== 'url');
            document.getElementById('imageInputFileContainer').classList.toggle('hidden', mode !== 'file');
            document.getElementById('imageInputCameraContainer').classList.toggle('hidden', mode !== 'camera');

            document.getElementById('btnModeUrl').className = mode === 'url' ? 'flex-1 bg-emerald-500 text-slate-950 text-xs font-bold py-1.5 rounded-lg' : 'flex-1 bg-slate-800 text-slate-300 text-xs py-1.5 rounded-lg';
            document.getElementById('btnModeFile').className = mode === 'file' ? 'flex-1 bg-emerald-500 text-slate-950 text-xs font-bold py-1.5 rounded-lg' : 'flex-1 bg-slate-800 text-slate-300 text-xs py-1.5 rounded-lg';
            document.getElementById('btnModeCamera').className = mode === 'camera' ? 'flex-1 bg-emerald-500 text-slate-950 text-xs font-bold py-1.5 rounded-lg' : 'flex-1 bg-slate-800 text-slate-300 text-xs py-1.5 rounded-lg';

            if (mode === 'camera') {
                startCamera();
            } else {
                stopCamera();
            }
        }

        async function startCamera() {
            try {
                mediaStream = await navigator.mediaDevices.getUserMedia({ video: true });
                document.getElementById('cameraStream').srcObject = mediaStream;
            } catch (err) {
                alert("Camera access denied or unavailable.");
            }
        }

        function stopCamera() {
            if (mediaStream) {
                mediaStream.getTracks().forEach(track => track.stop());
                mediaStream = null;
            }
        }

        function captureCameraSnapshot() {
            const video = document.getElementById('cameraStream');
            const canvas = document.getElementById('cameraCanvas');
            canvas.width = video.videoWidth || 320;
            canvas.height = video.videoHeight || 240;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
            const dataUrl = canvas.toDataURL('image/png');
            document.getElementById('finalImageValue').value = dataUrl;
            alert("Snapshot captured successfully!");
            stopCamera();
        }

        function encodeFileToBase64(element) {
            const file = element.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    document.getElementById('finalImageValue').value = e.target.result;
                };
                reader.readAsDataURL(file);
            }
        }

        async function handleCatalogUpdate(event) {
            event.preventDefault();
            
            let imgVal = document.getElementById('finalImageValue').value;
            if (!imgVal) {
                imgVal = document.getElementById('itemImage').value || 'https://images.unsplash.com/photo-1550583724-b2692b85b150?w=300';
            }

            const payload = {
                merchantId: currentMerchantId,
                name: document.getElementById('itemName').value,
                category: document.getElementById('itemCategory').value,
                price: document.getElementById('itemPrice').value,
                stock: document.getElementById('itemStock').value,
                image: imgVal
            };

            try {
                const res = await fetch('/api/merchant/catalog/update', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                const data = await res.json();
                if (data.success) {
                    document.getElementById('catalogForm').reset();
                    document.getElementById('finalImageValue').value = '';
                    loadCatalog();
                } else {
                    alert("Error updating catalog: " + data.error);
                }
            } catch (err) {
                console.error("Error:", err);
                alert("Network error connecting to server.");
            }
        }

        function deleteItem(itemId) {
            alert("Delete requested for item: " + itemId);
        }

        function logoutMerchant() {
            localStorage.removeItem('rds_merchantId');
            localStorage.removeItem('rds_shopName');
            stopCamera();
            window.location.href = '/merchant';
        }

        // Initialize on load
        loadCatalog();
    </script>
</body>
</html>
