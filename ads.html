<body class="text-slate-100 font-sans antialiased overflow-hidden selection:bg-pink-500 selection:text-white">
<div id="app" class="relative mx-auto h-full w-full max-w-md bg-black flex flex-col">

  <!-- ===================== HOME ===================== -->
  <section id="vHome" class="view relative flex-1 min-h-0">
    <header class="absolute top-0 inset-x-0 z-30 flex items-center justify-between px-4 pt-3 pb-6 bg-gradient-to-b from-black/70 to-transparent pointer-events-none">
      <button id="btnStories" data-act="stories" aria-label="Stories" class="pointer-events-auto relative w-9 h-9 rounded-full bg-black/40 text-white flex items-center justify-center"><i class="fa-solid fa-circle-notch"></i><span id="storyDot" class="hidden absolute -top-0.5 -right-0.5 w-3 h-3 rounded-full bg-pink-500 border-2 border-black"></span></button>
      <div class="flex items-center gap-5 pointer-events-auto" role="tablist">
        <button id="tabFollowing" role="tab" class="text-[15px] font-semibold text-white/60 pb-1 border-b-2 border-transparent">Following</button>
        <button id="tabForYou" role="tab" class="text-[15px] font-bold text-white pb-1 border-b-2 border-white">For You</button>
      </div>
      <button id="btnSound" aria-label="Sound on or off" class="pointer-events-auto w-9 h-9 rounded-full bg-black/40 text-white flex items-center justify-center"><i class="fa-solid fa-volume-xmark"></i></button>
    </header>
    <main id="feed" class="feed" aria-label="Posts"></main>
  </section>

  <!-- ===================== DISCOVER ===================== -->
  <section id="vDiscover" class="view hidden flex-1 min-h-0 overflow-y-auto pb-24">
    <div class="sticky top-0 z-20 bg-black px-4 pt-4 pb-3">
      <div class="flex items-center gap-2 bg-slate-900 border border-slate-800 rounded-full px-4 py-2.5">
        <i class="fa-solid fa-magnifying-glass text-slate-500"></i>
        <input id="q" type="search" autocomplete="off" placeholder="Search people or #hashtags" class="flex-1 bg-transparent outline-none text-sm text-white placeholder-slate-500">
      </div>
    </div>
    <div id="discover" class="px-4"></div>
  </section>

  <!-- ===================== INBOX ===================== -->
  <section id="vInbox" class="view hidden flex-1 min-h-0 overflow-y-auto pb-24">
    <div class="sticky top-0 z-20 bg-black px-4 pt-4 pb-2 flex gap-2">
      <button id="ibNotif" class="px-4 py-2 rounded-full text-sm font-bold bg-white text-black">Activity</button>
      <button id="ibMsgs" class="px-4 py-2 rounded-full text-sm font-bold bg-slate-900 text-slate-300">Messages <span id="msgBadge" class="hidden ml-1 text-[10px] bg-pink-600 text-white rounded-full px-1.5 py-0.5"></span></button>
    </div>
    <div id="inbox" class="px-2"></div>
  </section>

  <!-- ===================== PROFILE (mine) ===================== -->
  <section id="vMe" class="view hidden flex-1 min-h-0 overflow-y-auto pb-24"><div id="me"></div></section>

  <!-- ===================== BOTTOM NAV ===================== -->
  <nav class="absolute bottom-0 inset-x-0 z-40 bg-black border-t border-white/10 safe-b">
    <div class="grid grid-cols-5 items-center h-14 text-[10px]">
      <button data-nav="vHome" class="nav flex flex-col items-center gap-0.5 text-white" aria-label="Home"><i class="fa-solid fa-house text-lg"></i>Home</button>
      <button data-nav="vDiscover" class="nav flex flex-col items-center gap-0.5 text-white/50" aria-label="Discover"><i class="fa-solid fa-compass text-lg"></i>Discover</button>
      <button id="navCreate" class="flex items-center justify-center" aria-label="Create a post"><span class="w-12 h-8 rounded-xl bg-gradient-to-r from-cyan-400 via-white to-pink-500 flex items-center justify-center"><span class="w-10 h-8 rounded-lg bg-white text-black flex items-center justify-center"><i class="fa-solid fa-plus"></i></span></span></button>
      <button data-nav="vInbox" class="nav relative flex flex-col items-center gap-0.5 text-white/50" aria-label="Inbox"><i class="fa-solid fa-inbox text-lg"></i>Inbox<span id="inboxBadge" class="hidden absolute top-0 right-5 min-w-[16px] h-4 px-1 rounded-full bg-pink-600 text-white text-[10px] leading-4 text-center"></span></button>
      <button data-nav="vMe" class="nav flex flex-col items-center gap-0.5 text-white/50" aria-label="Profile"><i class="fa-solid fa-user text-lg"></i>Me</button>
    </div>
  </nav>

  <!-- ===================== OVERLAYS ===================== -->
  <div id="scrim" class="hidden absolute inset-0 z-50 bg-black/60"></div>
  <!-- generic bottom sheet -->
  <div id="sheet" class="sheet hidden absolute inset-x-0 bottom-0 z-[60] max-h-[85%] flex flex-col bg-slate-950 border-t border-slate-800 rounded-t-3xl safe-b" role="dialog" aria-modal="true">
    <div class="flex items-center justify-between px-5 pt-4 pb-2"><h2 id="sheetTitle" class="text-base font-bold text-white"></h2><button id="sheetClose" aria-label="Close" class="w-8 h-8 rounded-full bg-slate-900 text-slate-300"><i class="fa-solid fa-xmark"></i></button></div>
    <div id="sheetBody" class="flex-1 min-h-0 overflow-y-auto px-5 pb-5"></div>
  </div>
  <!-- full-screen page (other profile, chat, single post) -->
  <div id="page" class="hidden absolute inset-0 z-[55] bg-black flex flex-col">
    <div class="flex items-center gap-3 px-3 pt-3 pb-2 border-b border-white/10"><button id="pageBack" aria-label="Back" class="w-9 h-9 rounded-full bg-slate-900 text-white"><i class="fa-solid fa-chevron-left"></i></button><div id="pageTitle" class="flex-1 min-w-0 font-bold text-white truncate"></div><div id="pageAction"></div></div>
    <div id="pageBody" class="flex-1 min-h-0 overflow-y-auto"></div>
  </div>
  <div id="toast" class="hidden absolute left-1/2 -translate-x-1/2 bottom-20 z-[70] max-w-[90%] px-4 py-2.5 rounded-full bg-white text-black text-sm font-semibold shadow-xl" role="status" aria-live="polite"></div>
</div>

<script>
(() => {
'use strict';
const $ = (s, r = document) => r.querySelector(s), $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const safeMedia = (u) => (typeof u === 'string' && /^\/api\/ads\/media\/M_[a-z0-9]+$/.test(u) ? u : '');
const safeCta = (u) => { const s = String(u || ''); if (/^\/(user|store|merchant|ads)(\/|\?|$)/.test(s)) return s; try { const x = new URL(s); return x.protocol === 'https:' ? x.toString() : ''; } catch (e) { return ''; } };
const fmtN = (n) => { n = Number(n) || 0; return n >= 1e6 ? (n / 1e6).toFixed(1).replace(/\.0$/, '') + 'M' : n >= 1e3 ? (n / 1e3).toFixed(1).replace(/\.0$/, '') + 'K' : String(n); };
const ago = (t) => { const s = Math.max(1, (Date.now() - t) / 1000); return s < 60 ? 'now' : s < 3600 ? Math.floor(s / 60) + 'm' : s < 86400 ? Math.floor(s / 3600) + 'h' : s < 604800 ? Math.floor(s / 86400) + 'd' : new Date(t).toLocaleDateString('en-KE', { day: 'numeric', month: 'short' }); };
const avatar = (u, size = 'w-10 h-10 text-sm') => { const a = u && safeMedia(u.avatar); return a ? `<img src="${a}" alt="" class="${size} rounded-full object-cover bg-slate-800">` : `<span class="${size} rounded-full bg-gradient-to-tr from-pink-600 to-purple-600 inline-flex items-center justify-center font-bold text-white">${esc(((u && (u.name || u.handle)) || '?').trim()[0] || '?').toUpperCase()}</span>`; };
const richText = (t) => esc(t).replace(/(^|\s)#([\p{L}\p{N}_]{2,40})/gu, (m, sp, tag) => `${sp}<button data-act="tag" data-tag="${tag}" class="font-bold text-white">#${tag}</button>`).replace(/(^|\s)@([a-z0-9_.]{3,24})/gi, (m, sp, h) => `${sp}<button data-act="profile" data-handle="${h}" class="font-bold text-white">@${h}</button>`);

let token = localStorage.getItem('rds_social_token') || null, me = null, socket = null, sound = false, tab = 'foryou', cursor = 0, loading = false, done = false, chatWith = null;
const posts = new Map();
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.classList.remove('hidden'); clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.add('hidden'), 2600); }
async function api(path, opts = {}) {
  const h = { ...(opts.headers || {}) }; if (token) h.Authorization = 'Bearer ' + token; if (opts.body !== undefined && !(opts.raw)) h['Content-Type'] = 'application/json';
  const res = await fetch('/api/ads' + path, { method: opts.method || 'GET', headers: h, body: opts.raw ? opts.raw : opts.body !== undefined ? JSON.stringify(opts.body) : undefined });
  let d = null; try { d = await res.json(); } catch (e) {}
  if (res.status === 401 && token && !opts.quiet401) { signOutLocal(); }
  if (!res.ok || !d || d.success === false) { const e = new Error((d && d.error) || 'Something went wrong (' + res.status + ').'); e.status = res.status; throw e; }
  return d;
}
function signOutLocal() { token = null; me = null; localStorage.removeItem('rds_social_token'); if (socket) { try { socket.disconnect(); } catch (e) {} socket = null; } paintBadges(); }
const need = (fn) => (...a) => (token ? fn(...a) : openAuth(() => fn(...a)));

/* ---------------- sheets & pages ---------------- */
let sheetOnClose = null;
function openSheet(title, html, onClose) { $('#sheetTitle').textContent = title; $('#sheetBody').innerHTML = html; $('#scrim').classList.remove('hidden'); $('#sheet').classList.remove('hidden'); sheetOnClose = onClose || null; }
function closeSheet() { $('#sheet').classList.add('hidden'); $('#scrim').classList.add('hidden'); const f = sheetOnClose; sheetOnClose = null; if (f) f(); }
$('#sheetClose').onclick = closeSheet; $('#scrim').onclick = closeSheet;
let pageStack = [];
function openPage(title, html, actionHtml, onShow) { pageStack.push({ title, html, actionHtml, onShow }); showPage(); }
function showPage() { const p = pageStack[pageStack.length - 1]; if (!p) { $('#page').classList.add('hidden'); chatWith = null; resumeFeed(); return; } pauseAll(); $('#pageTitle').textContent = p.title; $('#pageAction').innerHTML = p.actionHtml || ''; $('#pageBody').innerHTML = p.html; $('#page').classList.remove('hidden'); if (p.onShow) p.onShow(); }
$('#pageBack').onclick = () => { pageStack.pop(); chatWith = null; showPage(); };
document.addEventListener('keydown', e => { if (e.key === 'Escape') { if (!$('#sheet').classList.contains('hidden')) closeSheet(); else if (pageStack.length) $('#pageBack').click(); } });

/* ---------------- auth ---------------- */
function openAuth(after) {
  const step1 = `<p class="text-sm text-slate-400 mb-4">Sign in with your phone number to post, like, comment and message.</p>
    <label class="block text-xs text-slate-400 mb-1" for="aPhone">Phone number</label><input id="aPhone" type="tel" inputmode="tel" autocomplete="tel" placeholder="0712 345 678" class="w-full bg-slate-900 border border-slate-800 rounded-xl px-4 py-3 text-white outline-none focus:border-pink-500">
    <button id="aSend" class="mt-4 w-full py-3 rounded-xl font-bold text-white bg-gradient-to-r from-pink-600 to-purple-600">Send code</button><div id="aErr" class="mt-3 text-sm text-rose-400"></div>`;
  openSheet('Sign in', step1);
  const err = (m) => { $('#aErr').textContent = m; };
  $('#aSend').onclick = async () => {
    const phone = $('#aPhone').value.trim(); if (!phone) return err('Enter your phone number.');
    try { const d = await api('/auth/request-code', { method: 'POST', body: { phone } }); codeStep(d.phone, d.message); } catch (e) { err(e.message); }
  };
  function codeStep(phone, msg) {
    $('#sheetBody').innerHTML = `<p class="text-sm text-slate-400 mb-4">${esc(msg)}</p><label class="block text-xs text-slate-400 mb-1" for="aCode">Code</label>
      <input id="aCode" inputmode="numeric" autocomplete="one-time-code" maxlength="6" class="w-full bg-slate-900 border border-slate-800 rounded-xl px-4 py-3 text-center text-2xl tracking-[0.5em] text-white outline-none focus:border-pink-500">
      <button id="aVerify" class="mt-4 w-full py-3 rounded-xl font-bold text-white bg-gradient-to-r from-pink-600 to-purple-600">Continue</button><div id="aErr" class="mt-3 text-sm text-rose-400"></div>`;
    $('#aCode').focus();
    $('#aVerify').onclick = async () => {
      try { const d = await api('/auth/verify', { method: 'POST', body: { phone, code: $('#aCode').value.trim() } }); token = d.token; localStorage.setItem('rds_social_token', token); me = d.user; connectSocket(); paintBadges();
        if (d.isNew) profileStep(after); else { closeSheet(); toast('Welcome back, ' + me.name); if (after) after(); refreshFeed(); } } catch (e) { err(e.message); }
    };
  }
  function profileStep(after2) {
    $('#sheetTitle').textContent = 'Create your profile';
    $('#sheetBody').innerHTML = `<label class="block text-xs text-slate-400 mb-1" for="pName">Your name</label><input id="pName" maxlength="50" class="w-full bg-slate-900 border border-slate-800 rounded-xl px-4 py-3 text-white outline-none focus:border-pink-500">
      <label class="block text-xs text-slate-400 mt-3 mb-1" for="pHandle">Username</label><div class="flex items-center bg-slate-900 border border-slate-800 rounded-xl px-4"><span class="text-slate-500">@</span><input id="pHandle" maxlength="24" value="${esc(me.handle)}" class="flex-1 bg-transparent py-3 text-white outline-none"></div>
      <p class="text-xs text-slate-500 mt-1">3 to 24 letters, numbers, dots or underscores.</p><button id="pSave" class="mt-4 w-full py-3 rounded-xl font-bold text-white bg-gradient-to-r from-pink-600 to-purple-600">Save</button><div id="aErr" class="mt-3 text-sm text-rose-400"></div>`;
    $('#pSave').onclick = async () => { try { const d = await api('/me', { method: 'PATCH', body: { name: $('#pName').value, handle: $('#pHandle').value } }); me = d.user; closeSheet(); toast('Welcome to RDS Social, ' + me.name + '!'); if (after2) after2(); refreshFeed(); } catch (e) { err(e.message); } };
  }
}

/* ---------------- feed ---------------- */
function mediaHtml(p) {

function upload(file, onProgress) {
  return new Promise((resolve, reject) => {
    const x = new XMLHttpRequest(); x.open('POST', '/api/ads/media'); x.setRequestHeader('Authorization', 'Bearer ' + token); x.setRequestHeader('Content-Type', file.type || 'application/octet-stream');
    x.upload.onprogress = (e) => { if (e.lengthComputable) onProgress(e.loaded / e.total); };
    x.onload = () => { let d = null; try { d = JSON.parse(x.responseText); } catch (e) {} if (x.status === 200 && d && d.success) resolve(d.mediaId); else reject(new Error((d && d.error) || 'Upload failed.')); };
    x.onerror = () => reject(new Error('Upload failed. Check your connection.')); x.send(file);
  });
}

    if (a === 'dorepost') return doRepost(id);
    if (a === 'quote') return quoteComposer(id);
    if (a === 'save') return toggleSave(id);
    if (a === 'saved') return openSaved();
    if (a === 'promote') { closeSheet(); return promote(id); }
    if (a === 'adsmanager') return adsManager();
    if (a === 'camp') { const d = await api(`/campaigns/${id}`, { method: 'POST', body: { action: b.dataset.do } }); toast(d.message); pageStack.pop(); return adsManager(); }
    if (a === 'newgroup') return newGroup();
    if (a === 'groupinfo') return groupInfo(b.dataset.cid);
    if (a === 'voicecall') return startCall(b.dataset.cid, false);
    if (a === 'videocall') return startCall(b.dataset.cid, true);
    if (a === 'groupadd') { const cid = b.dataset.cid; return peoplePicker(new Map(), async (ids) => { if (!ids.length) return toast('Choose someone.'); await api(`/groups/${cid}/members`, { method: 'POST', body: { add: ids } }); pageStack.pop(); pageStack.pop(); showPage(); toast('Added'); groupInfo(cid); }, 'Add people', 'Add to group'); }
    if (a === 'groupremove') { await api(`/groups/${b.dataset.cid}/members`, { method: 'POST', body: { remove: [b.dataset.uid] } }); toast('Removed'); pageStack.pop(); return groupInfo(b.dataset.cid); }
    if (a === 'groupleave') { await api(`/groups/${b.dataset.cid}/leave`, { method: 'POST', body: {} }); toast('You left the group'); while (pageStack.length) pageStack.pop(); showPage(); return go('vInbox'); }
  } catch (x) { toast(x.message); }
});
setTimeout(refreshStoryDot, 1500); document.addEventListener('visibilitychange', () => { if (!document.hidden) refreshStoryDot(); });

document.addEventListener('click', async (e) => {
  const b = e.target.closest('[data-act]'); if (!b) return; const a = b.dataset.act, id = b.dataset.id;
  if (a === 'tap') return tap(id, e);
  if (a === 'like') return like(id);
  if (a === 'comments') return openComments(id);
  if (a === 'share') return share(id);
  if (a === 'more') return openMore(id);
  if (a === 'cta') return cta(id);
  if (a === 'expand') return b.classList.toggle('open');
  if (a === 'follow') return follow(b.dataset.uid, b);
  if (a === 'profile') return openProfile(b.dataset.handle);
  if (a === 'tag') { closeSheet(); while (pageStack.length) pageStack.pop(); showPage(); $('#q').value = '#' + b.dataset.tag; return go('vDiscover'); }
  if (a === 'openpost') { closeSheet(); return openPost(id); }
  if (a === 'create') return openCreate();
  if (a === 'signin') return openAuth(() => { go($$('.view').find(v => !v.classList.contains('hidden')).id); });
  if (a === 'retry') return refreshFeed();
  if (a === 'copylink') { try { await navigator.clipboard.writeText(location.origin + '/ads?post=' + encodeURIComponent(id)); toast('Link copied'); } catch (x) { toast(location.origin + '/ads?post=' + id); } return closeSheet(); }
  if (a === 'sharechat') { closeSheet(); return shareToChat(id); }
  if (a === 'fwd') return forwardMsg({ text: b.dataset.text, postId: b.dataset.postid });
  if (a === 'editpost') return editPost(id);
  if (a === 'deletepost') return deletePost(id);
  if (a === 'report') return report('post', id);
  if (a === 'message') { const p = posts.get(id); return startChat(p.author.id); }
  if (a === 'messageuser') return startChat(b.dataset.uid);
  if (a === 'doreport') { try { const d = await api(b.dataset.kind === 'user' ? `/users/${id}/report` : `/posts/${id}/report`, { method: 'POST', body: { reason: b.dataset.reason } }); closeSheet(); toast(d.message); } catch (x) { toast(x.message); } return; }
  if (a === 'usermore') { const uid = b.dataset.uid, bl = b.dataset.blocked === '1'; return openSheet('', `<button data-act="block" data-uid="${esc(uid)}" data-on="${bl ? 0 : 1}" class="w-full text-left py-3.5 border-b border-white/5 text-white"><i class="fa-solid fa-ban w-6"></i> ${bl ? 'Unblock' : 'Block'}</button><button data-act="report" data-kind="user" data-id="${esc(uid)}" class="w-full text-left py-3.5 text-rose-400"><i class="fa-solid fa-flag w-6"></i> Report account</button>`); }
  if (a === 'block') { try { const d = await api(`/users/${b.dataset.uid}/block`, { method: 'POST', body: { block: b.dataset.on === '1' } }); closeSheet(); toast(d.blocked ? 'Blocked. They can no longer see your posts or message you.' : 'Unblocked'); pageStack.pop(); showPage(); refreshFeed(); } catch (x) { toast(x.message); } return; }
  if (a === 'delcomment') { try { await api(`/posts/${id}/comments/${b.dataset.cid}`, { method: 'DELETE' }); if (openComments.reload) openComments.reload(); } catch (x) { toast(x.message); } return; }
  if (a === 'creply') { if (openComments.setReply) openComments.setReply(b.dataset.cid, b.dataset.handle); return; }
  if (a === 'clike') { const was = b.classList.contains('text-pink-400'); try { const d = await api(`/posts/${id}/comments/${b.dataset.cid}/like`, { method: 'POST', body: { like: !was } }); b.classList.toggle('text-pink-400', d.liked); const n = b.querySelector('[data-clikes]'); if (n) n.textContent = d.likes; } catch (x) { toast(x.message); } return; }
  if (a === 'openchat') return openChat(b.dataset.cid);
  if (a === 'editprofile') return editProfile();
  if (a === 'settings') return settings();
  if (a === 'signout') { try { await api('/auth/logout', { method: 'POST', body: {} }); } catch (x) {} signOutLocal(); closeSheet(); toast('Signed out'); go('vHome'); return refreshFeed(); }
  if (a === 'deleteaccount') { openSheet('Delete your account?', `<p class="text-sm text-slate-400">Your profile, posts, likes, comments and messages will be deleted. This cannot be undone. Type <b class="text-white">DELETE</b> to confirm.</p><input id="delTxt" class="mt-3 w-full bg-slate-900 border border-slate-800 rounded-xl px-4 py-3 text-white outline-none"><button id="delGo" class="mt-3 w-full py-3 rounded-xl font-bold text-white bg-rose-600">Delete my account</button>`); $('#delGo').onclick = async () => { try { await api('/auth/delete-account', { method: 'POST', body: { confirm: $('#delTxt').value.trim() } }); signOutLocal(); closeSheet(); toast('Your account was deleted.'); go('vHome'); refreshFeed(); } catch (x) { toast(x.message); } }; return; }
});
// Report on a user from usermore uses kind=user
document.addEventListener('click', (e) => { const b = e.target.closest('[data-act="report"][data-kind="user"]'); if (b) { e.stopImmediatePropagation(); report('user', b.dataset.id); } }, true);

/* ---------------- start ---------------- */
(async () => {
  if (token) { try { const d = await api('/me', { quiet401: true }); me = d.user; connectSocket(); paintBadges(); } catch (e) { signOutLocal(); } }
  const deep = new URLSearchParams(location.search).get('post');
  await loadFeed(true);
  if (deep && /^P_[a-z0-9]{8,40}$/.test(deep)) openPost(deep);
})();
window.__social = { get state() { return { token, me, tab, cursor, done, posts: [...posts.keys()] }; } };
})();
</script>
