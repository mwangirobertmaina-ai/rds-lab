<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RDS Sovereign Immersive Feed</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="/socket.io/socket.io.js"></script>
    <style>
        .reel-container {
            scroll-snap-type: y mandatory;
            overflow-y: scroll;
            height: 100vh;
        }
        .reel-item {
            scroll-snap-align: start;
            scroll-snap-stop: always;
            height: 100vh;
        }
        ::-webkit-scrollbar { display: none; }
    </style>
</head>
<body class="bg-black text-slate-100 font-sans overflow-hidden selection:bg-purple-500 selection:text-white">

    <!-- SECURE AUTH MODAL -->
    <div id="secureAuthModal" class="fixed inset-0 bg-black/95 backdrop-blur-md z-50 flex items-center justify-center p-4">
        <div class="bg-slate-900 border border-slate-800 w-full max-w-md rounded-3xl p-6 shadow-2xl space-y-4">
            <div class="text-center space-y-1">
                <div class="bg-gradient-to-tr from-purple-600 to-pink-600 text-white w-12 h-12 mx-auto rounded-2xl flex items-center justify-center text-xl font-bold shadow-lg shadow-purple-600/30">
                    <i class="fa-solid fa-bolt"></i>
                </div>
                <h3 class="text-base font-bold text-white">RDS Sovereign Account</h3>
                <p class="text-xs text-slate-400">Sign in or register to publish and interact with the feed.</p>
            </div>

            <div id="authStep1" class="space-y-3">
                <div>
                    <label class="block text-[10px] uppercase tracking-wider text-slate-400 mb-1 font-semibold">Your Full Name</label>
                    <input type="text" id="regFullName" placeholder="e.g. Robert Maina" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2.5 text-xs text-white outline-none focus:border-purple-500">
                </div>
                <div>
                    <label class="block text-[10px] uppercase tracking-wider text-slate-400 mb-1 font-semibold">Username (@handle)</label>
                    <input type="text" id="regHandle" placeholder="e.g. @robert_maina" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2.5 text-xs text-white outline-none focus:border-purple-500 font-mono">
                </div>
                <div>
                    <label class="block text-[10px] uppercase tracking-wider text-slate-400 mb-1 font-semibold">Email or Phone Number</label>
                    <input type="text" id="loginContactInput" placeholder="mwangirobertmaina@gmail.com" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2.5 text-xs text-white outline-none focus:border-purple-500 font-mono">
                </div>
                <button onclick="requestSecurityOtp()" class="w-full bg-gradient-to-r from-purple-600 to-pink-600 hover:opacity-90 text-white font-bold py-3 rounded-xl transition text-xs shadow-lg cursor-pointer">
                    ✨ Send Verification Code
                </button>
            </div>

            <div id="authStep2" class="space-y-3 hidden">
                <div>
                    <label class="block text-[10px] uppercase tracking-wider text-emerald-400 mb-1 font-semibold">Enter 6-Digit Code</label>
                    <input type="text" id="loginOtpInput" maxlength="6" placeholder="------" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2.5 text-center tracking-widest text-white font-mono text-base outline-none focus:border-emerald-500">
                </div>
                <button onclick="verifyAndCompleteLogin()" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-3 rounded-xl transition text-xs shadow-lg cursor-pointer">
                    🚀 Complete Sign In
                </button>
            </div>
        </div>
    </div>

    <!-- CREATE POST STUDIO MODAL -->
    <div id="createPostModal" class="fixed inset-0 bg-black/9oidal backdrop-blur-md z-50 hidden flex items-center justify-center p-4 bg-black/80">
        <div class="bg-slate-900 border border-slate-800 w-full max-w-lg rounded-3xl p-6 shadow-2xl space-y-4">
            <div class="flex justify-between items-center border-b border-slate-800 pb-3">
                <h3 class="text-sm font-bold text-white flex items-center gap-2"><i class="fa-solid fa-circle-plus text-purple-400"></i> Create New Reel / Post</h3>
                <button onclick="closeCreateModal()" class="text-slate-400 hover:text-white"><i class="fa-solid fa-xmark text-lg"></i></button>
            </div>

            <div class="grid grid-cols-2 gap-2">
                <label class="bg-purple-600/20 hover:bg-purple-600/30 text-purple-300 border border-purple-500/30 py-3 rounded-xl text-xs font-bold cursor-pointer flex items-center justify-center gap-2">
                    <i class="fa-solid fa-upload"></i> Upload Media File
                    <input type="file" id="localMediaFile" accept="video/*,image/*" onchange="handleLocalFileUpload(event)" class="hidden">
                </label>
                <button type="button" onclick="openCameraStudio()" class="bg-cyan-600/20 hover:bg-cyan-600/30 text-cyan-300 border border-cyan-500/30 py-3 rounded-xl text-xs font-bold cursor-pointer flex items-center justify-center gap-2">
                    <i class="fa-solid fa-camera"></i> Live Camera
                </button>
            </div>

            <form onsubmit="publishPost(event)" class="space-y-3">
                <div>
                    <label class="block text-[10px] uppercase tracking-wider text-slate-400 mb-1 font-semibold">Caption / Title</label>
                    <input type="text" id="postTitle" required placeholder="What's on your mind? #fyp" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2.5 text-xs text-white outline-none focus:border-purple-500">
                </div>
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-[10px] uppercase tracking-wider text-slate-400 mb-1 font-semibold">Category</label>
                        <select id="postVertical" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-2.5 py-2.5 text-xs text-white outline-none">
                            <option value="MOTIVATION">🔥 Motivation</option>
                            <option value="MUSIC">🎵 Music</option>
                            <option value="COMEDY">😂 Comedy</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-[10px] uppercase tracking-wider text-slate-400 mb-1 font-semibold">Media Type</label>
                        <select id="postMediaType" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-2.5 py-2.5 text-xs text-white outline-none">
                            <option value="Video Clip">🎬 Video Reel (9:16)</option>
                            <option value="Photo">📸 Photo Snap</option>
                        </select>
                    </div>
                </div>
                <div>
                    <label class="block text-[10px] uppercase tracking-wider text-slate-400 mb-1 font-semibold">Media URL (Auto-filled on Upload)</label>
                    <input type="url" id="postMediaUrl" required placeholder="https://..." class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2.5 text-xs text-white font-mono outline-none">
                </div>
                <button type="submit" class="w-full bg-gradient-to-r from-purple-600 to-pink-600 hover:opacity-90 text-white font-bold py-3 rounded-xl transition text-xs shadow-lg cursor-pointer">
                    🚀 Post to Feed
                </button>
            </form>
        </div>
    </div>

    <!-- TOP FLOATING NAVBAR (TikTok Style) -->
    <header class="absolute top-0 left-0 right-0 z-40 p-4 flex justify-between items-center bg-gradient-to-b from-black/80 to-transparent pointer-events-none">
        <div class="flex items-center space-x-4 pointer-events-auto">
            <button onclick="setFeedView('PUBLIC')" id="tabPublic" class="text-sm font-bold text-white drop-shadow cursor-pointer pb-1 border-b-2 border-white">For You</button>
            <button onclick="setFeedView('MINE')" id="tabMine" class="text-sm font-semibold text-slate-400 hover:text-white transition cursor-pointer pb-1 border-b-2 border-transparent">Following / My Posts</button>
        </div>
        <div class="flex items-center space-x-3 pointer-events-auto">
            <button onclick="openCreateModal()" class="bg-white/20 hover:bg-white/30 backdrop-blur-md text-white px-3.5 py-1.5 rounded-full text-xs font-bold transition flex items-center gap-1.5 cursor-pointer">
                <i class="fa-solid fa-plus"></i> Create
            </button>
            <button onclick="openAccountManager()" class="bg-black/40 border border-white/20 backdrop-blur-md text-emerald-400 px-3 py-1.5 rounded-full text-xs font-mono flex items-center gap-1.5 cursor-pointer">
                <i class="fa-solid fa-user-check"></i> <span id="displayUserHandle">@robert_maina</span>
            </button>
        </div>
    </header>

    <!-- FULLSCREEN VERTICAL REELS SCROLL CONTAINER -->
    <main id="reelsScrollContainer" class="reel-container w-full relative bg-black">
        <!-- Dynamically injected full-screen vertical posts -->
    </main>

    <script>
        let socket = io();
        let allPostsData = [];
        let activePostsPool = [];
        let currentFeedView = 'PUBLIC';
        
        let currentUser = { 
            name: localStorage.getItem('sov_user_name') || 'Robert Maina', 
            handle: localStorage.getItem('sov_user_handle') || '@robert_maina' 
        };
        let activeContactId = localStorage.getItem('sov_contact_id') || 'mwangirobertmaina@gmail.com';
        let sessionToken = localStorage.getItem('sov_session_token') || null;

        window.addEventListener('DOMContentLoaded', async () => {
            await fetchPosts();
            await validateSavedSession();
        });

        async function validateSavedSession() {
            if (sessionToken && activeContactId) {
                try {
                    const res = await fetch('/api/ads/auth/session-validate', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ contactId: activeContactId, sessionToken })
                    });
                    const data = await res.json();
                    if (data.success && data.user) {
                        currentUser.name = data.user.fullName;
                        currentUser.handle = data.user.handle;
                        document.getElementById('displayUserHandle').innerText = currentUser.handle;
                        document.getElementById('secureAuthModal').classList.add('hidden');
                        applyFeedFilters();
                        return;
                    }
                } catch (e) {}
            }
            document.getElementById('secureAuthModal').classList.remove('hidden');
        }

        async function fetchPosts() {
            try {
                const res = await fetch('/api/ads/list');
                const data = await res.json();
                if (data.success && data.advertisements) allPostsData = data.advertisements;
            } catch (e) {}
            applyFeedFilters();
        }

        function setFeedView(view) {
            currentFeedView = view;
            const btnPub = document.getElementById('tabPublic');
            const btnMine = document.getElementById('tabMine');

            if (view === 'PUBLIC') {
                btnPub.className = "text-sm font-bold text-white drop-shadow cursor-pointer pb-1 border-b-2 border-white";
                btnMine.className = "text-sm font-semibold text-slate-400 hover:text-white transition cursor-pointer pb-1 border-b-2 border-transparent";
            } else {
                btnMine.className = "text-sm font-bold text-white drop-shadow cursor-pointer pb-1 border-b-2 border-white";
                btnPub.className = "text-sm font-semibold text-slate-400 hover:text-white transition cursor-pointer pb-1 border-b-2 border-transparent";
            }
            applyFeedFilters();
        }

        function applyFeedFilters() {
            let pool = allPostsData;
            if (currentFeedView === 'MINE') {
                pool = pool.filter(p => p.authorHandle === currentUser.handle);
            }
            activePostsPool = pool;
            renderFeed();
        }

        function renderFeed() {
            const container = document.getElementById('reelsScrollContainer');
            if (!container) return;
            if (activePostsPool.length === 0) {
                container.innerHTML = `
                    <div class="reel-item flex flex-col items-center justify-center text-center p-6 space-y-3">
                        <div class="text-slate-500 text-base">No reels or posts found in this view.</div>
                        <button onclick="openCreateModal()" class="bg-purple-600 text-white font-bold px-5 py-2.5 rounded-xl text-xs">Create First Post</button>
                    </div>`;
                return;
            }

            container.innerHTML = activePostsPool.map(post => {
                const mediaSrc = post.mediaUrl || '';
                const isImage = post.mediaType === 'Photo' || 
                                mediaSrc.includes('/uploads/') || 
                                mediaSrc.includes('SNAP_') ||
                                mediaSrc.endsWith('.jpg') || 
                                mediaSrc.endsWith('.png') || 
                                mediaSrc.endsWith('.jpeg') || 
                                mediaSrc.endsWith('.webp') ||
                                mediaSrc.startsWith('data:image');

                return `
                    <div class="reel-item relative w-full h-full flex items-center justify-center bg-black">
                        <!-- Media View (9:16 Immersive) -->
                        ${isImage 
                            ? `<img src="${mediaSrc}" class="w-full h-full object-cover" onerror="this.onerror=null; this.src='https://images.unsplash.com/photo-1550583724-b2692b85b150?w=800';">` 
                            : `<video src="${mediaSrc}" class="w-full h-full object-cover cursor-pointer" autoplay loop playsinline muted onclick="this.paused ? this.play() : this.pause()"></video>`
                        }

                        <!-- Right Floating Action Bar (TikTok Style) -->
                        <div class="absolute right-4 bottom-24 flex flex-col items-center space-y-5 z-30">
                            <div class="relative">
                                <div class="w-10 h-10 rounded-full bg-gradient-to-tr from-purple-600 to-pink-600 border border-white flex items-center justify-center text-xs font-bold text-white shadow-lg">
                                    ${(post.authorName || 'R')[0]}
                                </div>
                            </div>
                            <button onclick="sendLike('${post.id}')" class="flex flex-col items-center group cursor-pointer">
                                <div class="w-11 h-11 rounded-full bg-black/40 backdrop-blur-md flex items-center justify-center text-rose-500 group-hover:bg-rose-500/20 transition">
                                    <i class="fa-solid fa-heart text-xl"></i>
                                </div>
                                <span id="likes_${post.id}" class="text-[11px] font-bold text-white mt-1 drop-shadow">${post.likes || 0}</span>
                            </button>
                            <button class="flex flex-col items-center group cursor-pointer">
                                <div class="w-11 h-11 rounded-full bg-black/40 backdrop-blur-md flex items-center justify-center text-white group-hover:bg-white/20 transition">
                                    <i class="fa-solid fa-comment-dots text-lg"></i>
                                </div>
                                <span class="text-[11px] font-bold text-white mt-1 drop-shadow">0</span>
                            </button>
                            <button class="flex flex-col items-center group cursor-pointer">
                                <div class="w-11 h-11 rounded-full bg-black/40 backdrop-blur-md flex items-center justify-center text-white group-hover:bg-white/20 transition">
                                    <i class="fa-solid fa-share text-lg"></i>
                                </div>
                                <span class="text-[11px] font-bold text-white mt-1 drop-shadow">Share</span>
                            </button>
                        </div>

                        <!-- Bottom Left Overlay Details (TikTok/Reels Style) -->
                        <div class="absolute bottom-0 left-0 right-16 p-5 bg-gradient-to-t from-black/90 via-black/40 to-transparent space-y-2 z-20 pointer-events-none">
                            <div class="flex items-center space-x-2 pointer-events-auto">
                                <span class="text-sm font-bold text-white drop-shadow">${post.authorName || 'Robert Maina'}</span>
                                <span class="text-xs text-purple-400 font-mono">${post.authorHandle || '@robert_maina'}</span>
                            </div>
                            <p class="text-xs text-slate-100 font-medium drop-shadow leading-relaxed">${post.title || post.caption || ''}</p>
                            <div class="flex items-center space-x-2 text-[11px] text-slate-300">
                                <i class="fa-solid fa-music animate-spin text-purple-400"></i>
                                <span class="truncate">Original Audio - RDS Sovereign Sound</span>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        async function sendLike(postId) {
            try {
                const res = await fetch('/api/ads/telemetry', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ adId: postId, action: 'like' })
                });
                const data = await res.json();
                if (data.success) {
                    const post = allPostsData.find(p => p.id === postId);
                    if (post) post.likes = data.ad.likes;
                    const lk = document.getElementById(`likes_${postId}`);
                    if (lk) lk.innerText = data.ad.likes;
                }
            } catch (e) {}
        }

        function openCreateModal() { document.getElementById('createPostModal').classList.remove('hidden'); }
        function closeCreateModal() { document.getElementById('createPostModal').classList.add('hidden'); }
        function openAccountManager() { alert(`Logged in as ${currentUser.name} (${currentUser.handle})`); }

        async function requestSecurityOtp() {
            const contact = document.getElementById('loginContactInput').value.trim();
            const name = document.getElementById('regFullName').value.trim();
            const handle = document.getElementById('regHandle').value.trim();
            if (!contact) { alert("Enter email or phone."); return; }
            if (name) currentUser.name = name;
            if (handle) currentUser.handle = handle;
            activeContactId = contact;

            const res = await fetch('/api/ads/auth/dispatch-otp', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ contactId: contact })
            });
            const data = await res.json();
            if (data.success) {
                alert(`🔐 OTP Code: [ ${data.otpCode} ]`);
                document.getElementById('authStep1').classList.add('hidden');
                document.getElementById('authStep2').classList.remove('hidden');
            }
        }

        async function verifyAndCompleteLogin() {
            const otpCode = document.getElementById('loginOtpInput').value.trim();
            const res = await fetch('/api/ads/auth/verify-security-challenge', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ contactId: activeContactId, otpCode, fullName: currentUser.name, handle: currentUser.handle })
            });
            const data = await res.json();
            if (data.success) {
                sessionToken = data.sessionToken;
                currentUser = { name: data.user.fullName, handle: data.user.handle };
                localStorage.setItem('sov_contact_id', activeContactId);
                localStorage.setItem('sov_session_token', sessionToken);
                localStorage.setItem('sov_user_name', currentUser.name);
                localStorage.setItem('sov_user_handle', currentUser.handle);

                document.getElementById('displayUserHandle').innerText = currentUser.handle;
                document.getElementById('secureAuthModal').classList.add('hidden');
                applyFeedFilters();
            } else { alert("❌ " + data.error); }
        }

        async function handleLocalFileUpload(e) {
            const file = e.target.files[0];
            if (!file) return;
            const fd = new FormData();
            fd.append('mediaFile', file);
            const res = await fetch('/api/ads/media/upload-file', { method: 'POST', body: fd });
            const data = await res.json();
            if (data.success) {
                document.getElementById('postMediaUrl').value = window.location.origin + data.fileUrl;
                document.getElementById('postMediaType').value = file.type.startsWith('image/') ? 'Photo' : 'Video Clip';
                alert("✅ File uploaded successfully!");
            }
        }

        async function publishPost(e) {
            e.preventDefault();
            const payload = {
                title: document.getElementById('postTitle').value,
                subtitle: '',
                targetVertical: document.getElementById('postVertical').value,
                mediaType: document.getElementById('postMediaType').value,
                rawMediaUrl: document.getElementById('postMediaUrl').value,
                authorName: currentUser.name,
                authorHandle: currentUser.handle,
                otpCode: "1234"
            };

            const res = await fetch('/api/ads/media/ingest', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });
            const data = await res.json();
            if (data.success) {
                allPostsData.unshift(data.ad);
                applyFeedFilters();
                closeCreateModal();
                alert("🎉 Successfully posted to feed!");
                document.querySelector('form').reset();
            } else { alert("❌ " + data.error); }
        }
    </script>
</body>
</html>
