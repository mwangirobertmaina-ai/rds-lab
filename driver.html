<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#000000">
  <title>RDS DRIVER FLEET TERMINAL (MOBILE FIXED)</title>

  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin=""/>

  <style>
    :root {
      --neon-green: #00ff88;
      --dark-bg: #000000;
      --panel-bg: #111111;
      --alert-red: #ff3366;
      --warn-yellow: #ffff00;
      --cyan: #00e5ff;
    }

    * { box-sizing: border-box; touch-action: manipulation; }

    body {
      background: var(--dark-bg);
      color: var(--neon-green);
      font-family: monospace;
      padding: 10px;
      margin: 0;
    }

    h2 { margin: 0 0 10px 0; font-size: 1.1rem; }

    button {
      margin: 4px 2px;
      padding: 12px 14px;
      background: var(--neon-green);
      color: #000;
      font-weight: bold;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-family: monospace;
      font-size: 0.85rem;
    }

    .btn-danger { background: var(--alert-red); color: #fff; }
    .btn-warn { background: var(--warn-yellow); color: #000; }
    .btn-cyan { background: var(--cyan); color: #000; }

    select, input {
      padding: 10px;
      background: #111;
      color: var(--neon-green);
      border: 1px solid var(--neon-green);
      border-radius: 4px;
      font-family: monospace;
      margin-bottom: 5px;
      width: 100%;
    }

    .box {
      border: 1px solid var(--neon-green);
      border-radius: 6px;
      padding: 10px;
      margin-bottom: 10px;
      background: var(--panel-bg);
    }

    /* Fixed height and explicit Z-index for mobile touch events */
    #map {
      height: 350px;
      width: 100%;
      border: 1px solid var(--neon-green);
      border-radius: 4px;
      background: #111;
      margin-top: 8px;
      z-index: 1;
      position: relative;
    }

    .status-badge {
      font-size: 0.8em;
      padding: 2px 6px;
      border: 1px solid var(--neon-green);
      display: inline-block;
      margin-top: 4px;
    }

    pre {
      white-space: pre-wrap;
      word-break: break-all;
      max-height: 100px;
      overflow-y: auto;
      background: #050505;
      padding: 6px;
      border: 1px solid #222;
      color: #00ff88;
      font-size: 0.75rem;
    }
  </style>
</head>

<body>

<h2>🚚 RDS DRIVER TERMINAL</h2>

<div class="box">
  <label for="driverSelect"><strong>Active Driver:</strong></label>
  <select id="driverSelect" onchange="onDriverSelected()"></select>
  <button onclick="loadDrivers()">🔄 Refresh List</button>
  <span id="routeBadge" class="status-badge">Detecting Endpoint...</span>
</div>

<div class="box">
  <strong>STATUS:</strong>
  <div>
    <button onclick="goOnline()" class="btn-cyan">🟢 ONLINE</button>
    <button onclick="goOffline()" class="btn-danger">🔴 OFFLINE</button>
    <button onclick="setBusy()" class="btn-warn">🟡 BUSY</button>
  </div>
  <div style="margin-top: 5px;">
    <button onclick="startGPS()">📍 START GPS</button>
    <button onclick="stopGPS()" class="btn-danger">⛔ STOP GPS</button>
    <button onclick="refreshMap()" class="btn-cyan">🗺️ RE-CENTER MAP</button>
  </div>

  <p id="gps" style="margin: 8px 0 0 0; font-weight: bold;">GPS: --</p>
</div>

<!-- LIVE MAP CONTAINER -->
<div class="box">
  <strong>🗺️ Live GPS Position Map</strong>
  <div id="map"></div>
</div>

<div class="box">
  <strong>📦 ASSIGNED DELIVERIES</strong>
  <button onclick="createTestOrder()" style="width:100%; margin-top:6px;" class="btn-warn">⚡ Simulate Instant Order</button>
  <div id="jobs" style="margin-top:8px;"><em>Loading jobs...</em></div>
</div>

<div class="box">
  <strong>📡 Telemetry Log</strong>
  <pre id="consoleLog">Terminal ready.</pre>
</div>

<!-- Leaflet JS -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>

<script>
const LOCAL_API = "http://localhost:3000";
const CLOUD_API = "https://rds-lab.onrender.com";
let API_BASE = window.location.origin.includes("localhost") ? LOCAL_API : CLOUD_API;

let driverId = "";
let map = null;
let marker = null;
let gpsWatch = null;

function sysLog(msg) {
  const el = document.getElementById("consoleLog");
  const time = new Date().toLocaleTimeString();
  el.innerText = `[${time}] ${typeof msg === 'object' ? JSON.stringify(msg) : msg}\n` + el.innerText;
}

async function resolveBackendRoute() {
  try {
    const controller = new AbortController();
    const timeout = setTimeout(() => controller.abort(), 800);
    await fetch(`${LOCAL_API}/health`, { method: "GET", signal: controller.signal });
    clearTimeout(timeout);
    API_BASE = LOCAL_API;
    document.getElementById("routeBadge").innerText = "Route: LOCAL";
  } catch (_) {
    API_BASE = CLOUD_API;
    document.getElementById("routeBadge").innerText = "Route: CLOUD (Render)";
  }
}

async function apiFetch(endpoints, options = {}) {
  const targetEndpoints = Array.isArray(endpoints) ? endpoints : [endpoints];
  for (const ep of targetEndpoints) {
    try {
      const res = await fetch(`${API_BASE}${ep}`, {
        ...options,
        headers: { "Content-Type": "application/json", ...(options.headers || {}) }
      });
      if (res.ok) return await res.json();
    } catch (err) {}
  }
  return null;
}

/* ================= MOBILE-COMPATIBLE MAP ENGINE ================= */
function initMap() {
  if (map) return;

  // Initialize Leaflet Map centered on Nairobi CBD
  map = L.map("map", {
    tap: true,
    touchZoom: true,
    dragging: true
  }).setView([-1.286389, 36.817223], 15);

  // CartoDB Dark Matter Tile Provider (No Referer Restrictions)
  L.tileLayer("https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png", {
    maxZoom: 19,
    subdomains: ["a", "b", "c", "d"],
    attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors &copy; <a href="https://carto.com/attributions">CARTO</a>'
  }).addTo(map);

  marker = L.marker([-1.286389, 36.817223]).addTo(map);

  // Force map to re-calculate container height on touch devices
  setTimeout(() => {
    map.invalidateSize();
  }, 500);
}

function refreshMap() {
  if (map) {
    map.invalidateSize();
    if (marker) map.panTo(marker.getLatLng());
    sysLog("Map viewport refreshed.");
  }
}

/* ================= DRIVER & GPS ENGINE ================= */
async function loadDrivers() {
  const data = await apiFetch(["/drivers", "/drivers/live"]);
  const select = document.getElementById("driverSelect");
  select.innerHTML = "";

  const driverList = (data && (data.drivers || data.data)) || [];

  if (driverList.length === 0) {
    select.innerHTML = "<option value=''>No drivers found</option>";
    driverId = "";
    return;
  }

  driverList.forEach(d => {
    const opt = document.createElement("option");
    opt.value = d.id;
    opt.innerText = `${d.name} (${d.status || 'OFFLINE'})`;
    select.appendChild(opt);
  });

  if (!driverId && driverList.length > 0) driverId = driverList[0].id;
  select.value = driverId;
  loadJobs();
}

function onDriverSelected() {
  driverId = document.getElementById("driverSelect").value;
  loadJobs();
}

async function setStatus(status) {
  if (!driverId) return alert("Select driver first.");
  const res = await apiFetch(["/updateDriverStatus", "/driver/status"], {
    method: "POST",
    body: JSON.stringify({ driverId, status })
  });
  if (res && res.success) {
    sysLog(`Status set: ${status}`);
    loadDrivers();
  }
}

function goOnline() { setStatus("online"); }
function goOffline() { setStatus("offline"); }
function setBusy() { setStatus("busy"); }

function startGPS() {
  if (!navigator.geolocation) return alert("Geolocation not supported on this phone.");

  if (gpsWatch !== null) navigator.geolocation.clearWatch(gpsWatch);

  gpsWatch = navigator.geolocation.watchPosition(
    async (pos) => {
      const lat = pos.coords.latitude;
      const lng = pos.coords.longitude;

      document.getElementById("gps").innerText = `GPS: ${lat.toFixed(5)}, ${lng.toFixed(5)}`;

      if (map && marker) {
        marker.setLatLng([lat, lng]);
        map.setView([lat, lng], 16);
        map.invalidateSize();
      }

      if (driverId) {
        await apiFetch(["/updateDriverLocation", "/driver/location"], {
          method: "POST",
          body: JSON.stringify({ driverId, location: { lat, lng } })
        });
      }
    },
    (err) => {
      sysLog(`GPS Error: ${err.message}`);
      document.getElementById("gps").innerText = `GPS Error: ${err.message}`;
    },
    { enableHighAccuracy: true, maximumAge: 0, timeout: 10000 }
  );

  sysLog("GPS Tracking started.");
}

function stopGPS() {
  if (gpsWatch !== null) {
    navigator.geolocation.clearWatch(gpsWatch);
    gpsWatch = null;
    document.getElementById("gps").innerText = "GPS: STOPPED";
  }
}

async function loadJobs() {
  if (!driverId) return;
  const data = await apiFetch(["/orders"]);
  const container = document.getElementById("jobs");
  const allOrders = (data && data.orders) || [];

  const assigned = allOrders.filter(o => o.driverId === driverId && o.status !== "completed");

  if (assigned.length === 0) {
    container.innerHTML = "<p>No active delivery jobs.</p>";
    return;
  }

  let html = "";
  assigned.forEach(j => {
    html += `
      <div style="padding:8px; border:1px solid #333; margin-bottom:5px;">
        <b>Order: ${j.id}</b> - $${j.total || j.amount || 0}<br>
        <button onclick="completeDelivery('${j.id}')" class="btn-warn" style="margin-top:5px; width:100%;">🏁 Complete Job</button>
      </div>
    `;
  });
  container.innerHTML = html;
}

async function completeDelivery(orderId) {
  const res = await apiFetch(["/order/complete", "/driver/complete"], {
    method: "POST",
    body: JSON.stringify({ orderId, driverId })
  });
  if (res && res.success) {
    sysLog(`Job ${orderId} completed.`);
    loadDrivers();
    loadJobs();
  }
}

async function createTestOrder() {
  const res = await apiFetch(["/order/create"], {
    method: "POST",
    body: JSON.stringify({ customerName: "Phone Test", amount: 20 })
  });
  if (res && res.success) {
    await setStatus("online");
    await apiFetch(["/dispatch/auto"], {
      method: "POST",
      body: JSON.stringify({ orderId: res.order.id, driverId })
    });
    loadJobs();
  }
}

window.onload = async () => {
  initMap();
  await resolveBackendRoute();
  await loadDrivers();
};
</script>

</body>
</html>
