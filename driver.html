<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#0b0f19">
  <title>RDS STAGE 51 | HYPER-SPEED HYBRID TERMINAL</title>

  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin=""/>

  <style>
    :root {
      --neon-green: #00ff88;
      --dark-bg: #0b0f19;
      --panel-bg: #111827;
      --card-bg: #181818;
      --text-dim: #9ca3af;
      --cyan: #38bdf8;
      --alert-red: #ff3366;
      --warn-yellow: #ffff00;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Courier New', Courier, monospace; touch-action: manipulation; }

    body {
      background-color: var(--dark-bg);
      color: var(--neon-green);
      padding: 10px;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--neon-green);
      padding-bottom: 10px;
      margin-bottom: 12px;
    }

    h1 { font-size: 0.95rem; letter-spacing: 1px; color: var(--neon-green); }
    .badge { background: var(--cyan); color: #000; padding: 3px 6px; font-weight: bold; font-size: 0.7rem; border-radius: 4px; }

    .terminal-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 10px;
      margin-bottom: 12px;
    }

    .panel {
      background: var(--panel-bg);
      border: 1px solid var(--neon-green);
      border-radius: 6px;
      padding: 10px;
    }

    .panel h2 { font-size: 0.85rem; margin-bottom: 8px; border-bottom: 1px dashed var(--neon-green); padding-bottom: 3px; text-transform: uppercase; color: var(--cyan); }

    .stat-display { font-size: 1.3rem; font-weight: bold; color: var(--neon-green); margin-bottom: 4px; }
    .stat-label { font-size: 0.65rem; color: var(--text-dim); text-transform: uppercase; }

    button {
      background: var(--neon-green);
      color: var(--dark-bg);
      border: none;
      padding: 9px;
      font-weight: bold;
      width: 100%;
      cursor: pointer;
      border-radius: 4px;
      text-transform: uppercase;
      font-family: monospace;
      margin-top: 5px;
      font-size: 0.75rem;
    }

    button:hover { opacity: 0.85; }
    .btn-cyan { background: var(--cyan); color: #000; }
    .btn-red { background: var(--alert-red); color: #fff; }
    .btn-warn { background: var(--warn-yellow); color: #000; }

    input, select {
      width: 100%;
      background: var(--dark-bg);
      border: 1px solid var(--neon-green);
      color: var(--neon-green);
      padding: 7px;
      margin-bottom: 6px;
      border-radius: 4px;
      font-family: monospace;
      font-size: 0.8rem;
    }

    #map {
      height: 250px;
      width: 100%;
      border: 1px solid var(--neon-green);
      border-radius: 4px;
      background: #000;
      margin-top: 5px;
      z-index: 1;
      position: relative;
    }

    .log-box {
      background: #000;
      border: 1px solid var(--text-dim);
      padding: 8px;
      height: 100px;
      overflow-y: auto;
      font-size: 0.65rem;
      color: var(--neon-green);
      border-radius: 4px;
      white-space: pre-wrap;
      word-break: break-all;
    }

    .auth-overlay {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(11, 15, 25, 0.97);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 9999;
    }

    .auth-card {
      background: var(--panel-bg);
      border: 2px solid var(--neon-green);
      padding: 20px;
      width: 280px;
      border-radius: 8px;
    }
  </style>
  <script src="/socket.io/socket.io.js"></script>
</head>
<body>

    <!-- LIGHTNING AUTH OVERLAY -->
    <div class="auth-overlay" id="authOverlay">
        <div class="auth-card">
            <h2 style="color:var(--neon-green); margin-bottom: 10px; border-bottom:1px dashed var(--neon-green); padding-bottom:3px;">STAGE 51 HYBRID AUTH</h2>
            <input type="text" id="authPhone" placeholder="Phone (2547XXXXXXXX)" value="254708374149">
            <input type="password" id="authPassword" placeholder="Password" value="secret123">
            <button onclick="authenticateDriver()">Connect Instantly</button>
            <div id="authMsg" style="margin-top: 6px; font-size: 0.7rem; text-align: center;"></div>
        </div>
    </div>

    <header>
        <h1>⚡ RDS 51 | HYPER-SPEED HYBRID</h1>
        <div class="badge" id="netBadge">PINGING...</div>
    </header>

    <div class="terminal-grid">
        <!-- WALLET & LIQUIDITY -->
        <div class="panel">
            <h2>Sovereign Wallet</h2>
            <div class="stat-label">Available Balance</div>
            <div class="stat-display" id="walletBalance">KES 0.00</div>
            <input type="number" id="payoutAmount" placeholder="Amount (KES)" value="1000">
            <button onclick="requestInstantPayout()" class="btn-cyan">Instant B2C Payout</button>
        </div>

        <!-- TELEMETRY & STATUS -->
        <div class="panel">
            <h2>Hybrid Telemetry</h2>
            <label for="statusSelect">Status:</label>
            <select id="statusSelect" onchange="updateDriverStatus()">
                <option value="ONLINE">ONLINE (Active)</option>
                <option value="BUSY">BUSY (On Trip)</option>
                <option value="OFFLINE">OFFLINE</option>
            </select>
            <div style="display: flex; gap: 4px;">
                <button onclick="startHyperGPS()" class="btn-cyan" style="flex:1;">🛰️ HYPER GPS</button>
                <button onclick="stopGPS()" class="btn-red" style="flex:1;">⛔ PAUSE</button>
            </div>
            <p id="gps" style="margin: 5px 0 0 0; font-size: 0.7rem; font-weight: bold;">GPS: Standby</p>
        </div>

        <!-- ACTIVE DISPATCH & COMPLETION -->
        <div class="panel">
            <h2>Active Order</h2>
            <input type="text" id="activeOrderId" placeholder="Order ID">
            <button onclick="completeCurrentTrip()" class="btn-warn">Complete & Credit</button>
        </div>
    </div>

    <!-- LIVE MAP CONTAINER -->
    <div class="panel">
        <h2>🗺️ Zero-Latency Map Telemetry</h2>
        <div id="map"></div>
        <button onclick="refreshMap()" class="btn-cyan" style="margin-top: 5px;">Recenter Instant</button>
    </div>

    <!-- SYSTEM LOGS -->
    <div class="panel">
        <h2>📡 Hybrid Audit Stream</h2>
        <div class="log-box" id="logBox">[SYSTEM] Hybrid engine initialized for local/online execution.</div>
    </div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>

    <script>
        let driverId = localStorage.getItem('rds_driver_id') || 'driver_1';
        let authToken = localStorage.getItem('rds_token') || '';
        let map = null;
        let marker = null;
        let gpsWatch = null;
        let socket = null;
        let lastLat = -1.286389;
        let lastLng = 36.817223;

        // Dynamic Hybrid Route Detection (Instant local fallback if offline, cloud acceleration if online)
        const API_BASE = window.location.origin;

        if (authToken) {
            document.getElementById('authOverlay').style.display = 'none';
            initTerminal();
        }

        async function authenticateDriver() {
            const phone = document.getElementById('authPhone').value;
            const password = document.getElementById('authPassword').value;
            const msg = document.getElementById('authMsg');

            try {
                // Non-blocking auto-registration check
                fetch(`${API_BASE}/api/auth/register`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name: "Hybrid Driver", phone, role: "DRIVER", password })
                }).catch(() => {});

                const res = await fetch(`${API_BASE}/api/auth/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ phone, password })
                });
                const data = await res.json();
                if (data.success) {
                    authToken = data.token;
                    driverId = data.user.id;
                    localStorage.setItem('rds_token', authToken);
                    localStorage.setItem('rds_driver_id', driverId);
                    document.getElementById('authOverlay').style.display = 'none';
                    appendLog(`Hybrid Session Active: ${data.user.name}`);
                    initTerminal();
                } else {
                    msg.style.color = "var(--alert-red)";
                    msg.innerText = data.error;
                }
            } catch (err) {
                msg.style.color = "var(--alert-red)";
                msg.innerText = "Fast-route connection error.";
            }
        }

        function appendLog(msg) {
            const box = document.getElementById('logBox');
            if (box) {
                box.innerText = `[${new Date().toLocaleTimeString()}] ${msg}\n` + box.innerText;
            }
        }

        function initMap() {
            if (map) return;
            const mapEl = document.getElementById("map");
            if (!mapEl) return;

            map = L.map("map", {
                zoomControl: false,
                attributionControl: false,
                fadeAnimation: false,
                markerZoomAnimation: false
            }).setView([lastLat, lastLng], 16);

            // Lightning-fast tile provider
            L.tileLayer("https://{s}.basemaps.cartocdn.com/rastertiles/dark_all/{z}/{x}/{y}{r}.png", {
                subdomains: 'abcd',
                maxZoom: 20,
                updateWhenIdle: true,
                keepBuffer: 1
            }).addTo(map);

            marker = L.marker([lastLat, lastLng]).addTo(map);
            setTimeout(() => map.invalidateSize(), 100);
        }

        function refreshMap() {
            if (map && marker) {
                map.invalidateSize();
                map.setView(marker.getLatLng(), 17, { animate: false });
            }
        }

        function initTerminal() {
            initMap();

            // Ping connection speed indicator
            const netBadge = document.getElementById('netBadge');
            if (netBadge) {
                netBadge.innerText = window.location.origin.includes('localhost') ? 'HYBRID: LOCAL' : 'HYBRID: CLOUD';
                netBadge.style.background = 'var(--neon-green)';
                netBadge.style.color = '#000';
            }

            try {
                socket = io();
                socket.on('connect', () => {
                    appendLog("WebSocket socket stream synchronized.");
                });
                socket.on('orderDispatched', (data) => {
                    if (data.driverId === driverId) {
                        appendLog(`⚡ INSTANT DISPATCH: ${data.orderId}`);
                        const orderInput = document.getElementById('activeOrderId');
                        if (orderInput) orderInput.value = data.orderId;
                    }
                });
            } catch (e) {
                appendLog("Socket standby mode active.");
            }

            startHyperGPS();
            refreshWallet();
        }

        function startHyperGPS() {
            if (!navigator.geolocation) return appendLog("GPS hardware unavailable.");
            if (gpsWatch !== null) navigator.geolocation.clearWatch(gpsWatch);

            // Zero-latency real-time stream configuration
            gpsWatch = navigator.geolocation.watchPosition(
                async (pos) => {
                    lastLat = pos.coords.latitude;
                    lastLng = pos.coords.longitude;
                    
                    const gpsEl = document.getElementById("gps");
                    if (gpsEl) gpsEl.innerText = `GPS: ${lastLat.toFixed(5)}, ${lastLng.toFixed(5)}`;

                    if (map && marker) {
                        const newLatLng = [lastLat, lastLng];
                        marker.setLatLng(newLatLng);
                        map.setView(newLatLng, map.getZoom(), { animate: false });
                    }

                    // Send telemetry instantly via non-blocking fetch pipeline
                    sendLocationToServer(lastLat, lastLng);
                },
                (err) => {
                    appendLog(`GPS warning: ${err.message}. Using default coordinates.`);
                    sendLocationToServer(-1.286389, 36.817223);
                },
                { enableHighAccuracy: true, maximumAge: 0, timeout: 3000 }
            );
            appendLog("Hyper-speed GPS watcher locked.");
        }

        function stopGPS() {
            if (gpsWatch !== null) {
                navigator.geolocation.clearWatch(gpsWatch);
                gpsWatch = null;
                const gpsEl = document.getElementById("gps");
                if (gpsEl) gpsEl.innerText = "GPS: PAUSED";
                appendLog("GPS stream paused.");
            }
        }

        function sendLocationToServer(lat, lng) {
            const statusEl = document.getElementById('statusSelect');
            const status = statusEl ? statusEl.value : 'ONLINE';
            // Asynchronous fire-and-forget packet transmission for absolute zero lag
            fetch(`${API_BASE}/api/drivers/location`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${authToken}` },
                body: JSON.stringify({ driverId, status, location: { lat, lng } })
            }).catch(() => {});
        }

        async function updateDriverStatus() {
            const statusEl = document.getElementById('statusSelect');
            const status = statusEl ? statusEl.value : 'ONLINE';
            appendLog(`Status updated: ${status}`);
            sendLocationToServer(lastLat, lastLng);
        }

        async function completeCurrentTrip() {
            const orderIdInput = document.getElementById('activeOrderId');
            const orderId = orderIdInput ? orderIdInput.value.trim() : '';
            if (!orderId) {
                alert("Input an active order ID.");
                return;
            }

            try {
                const res = await fetch(`${API_BASE}/api/drivers/complete-trip`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ driverId, orderId })
                });
                const data = await res.json();
                if (data.success) {
                    appendLog(`✅ Trip finalized: ${orderId}`);
                    if (orderIdInput) orderIdInput.value = '';
                    refreshWallet();
                } else {
                    alert(data.error);
                }
            } catch (err) {
                alert("Transaction timeout.");
            }
        }

        async function requestInstantPayout() {
            const amountInput = document.getElementById('payoutAmount');
            const amount = amountInput ? amountInput.value : 1000;
            try {
                const res = await fetch(`${API_BASE}/api/payouts/b2c`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ driverId, amount })
                });
                const data = await res.json();
                if (data.success) {
                    appendLog(`💸 Instant Payout Ref: ${data.payoutRecord.id}`);
                    refreshWallet();
                } else {
                    alert(data.error);
                }
            } catch (err) {
                alert("Payout gateway error.");
            }
        }

        async function refreshWallet() {
            try {
                const res = await fetch(`${API_BASE}/api/compliance/kra-vault`);
                const data = await res.json();
                if (data.success) {
                    const balanceEl = document.getElementById('walletBalance');
                    if (balanceEl) balanceEl.innerText = `KES ${(data.kraReport.metrics.grossVolume * 0.92).toFixed(2)}`;
                }
            } catch(e) {}
        }
    </script>
</body>
</html>
