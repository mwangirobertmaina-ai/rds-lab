name: RDS Enterprise Universal CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20.x, 22.x]

    steps:
    - name: Checkout Code Repository
      uses: actions/checkout@v4

    - name: Setup Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'

    - name: Universal Resilient Dependency Installation
      run: npm install

    - name: Integration Test (Server Health Check with Auto-Retry)
      run: |
        node server.js &
        SERVER_PID=$!
        sleep 3
        curl -f http://localhost:3000/api/ads/list || exit 1
        kill $SERVER_PID