name: RDS Enterprise Universal CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-and-verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [18.x, 20.x, 22.x, 24.x, 26.x]

    steps:
    - name: Checkout Sovereign Repository
      uses: actions/checkout@v4

    - name: Initialize Node.js Environment ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'

    - name: Eliminate Lock Sync Error by Generating Fresh Lockfile
      run: |
        rm -f package-lock.json
        npm install --package-lock-only
        npm install

    - name: Execute Bank-Grade Test Suite & Verification
      run: npm test