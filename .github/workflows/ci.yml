name: RDS Enterprise Universal CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-and-verify:
    runs-on: ubuntu-latest
    continue-on-error: ${{ matrix.node-version == '20.x' }}
    strategy:
      fail-fast: false
      matrix:
        node-version: [18.x, 20.x, 22.x, 24.x, 26.x]

    steps:
    - name: Checkout Sovereign Repository
      uses: actions/checkout@v4

    - name: Initialize Node.js Environment ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'

    - name: Clear npm Cache & Install Dependencies
      run: |
        npm cache clean --force
        npm install

    - name: Execute Bank-Grade Test Suite & Verification
      run: npm test