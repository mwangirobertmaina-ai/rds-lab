name: RDS Enterprise Universal CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  enterprise_verification:
    name: Enterprise Core & Daraja Verification
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        node-version: [18.x, 20.x, 22.x, 24.x]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install Dependencies and Axios
        run: |
          npm install axios --save
          npm install --legacy-peer-deps || npm install

      - name: Verify Enterprise Engine Syntax
        run: node -c server.js

      - name: Live Integration & Health Check
        run: |
          node server.js &
          SERVER_PID=$!
          sleep 4
          curl -f http://localhost:3000/health || exit 1
          kill $SERVER_PID

      - name: CI Gate Passed Successfully
        run: echo "Enterprise Core & Live Daraja verified on Node.js ${{ matrix.node-version }}"