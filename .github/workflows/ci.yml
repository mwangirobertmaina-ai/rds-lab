name: RDS Enterprise Universal CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18.x, 20.x, 22.x]

    steps:
    - name: Checkout Code Repository
      uses: actions/checkout@v4

    - name: Setup Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'

    - name: Install Linux Build Essentials (For Native Addons)
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential python3

    - name: Universal Resilient Dependency Installation
      run: npm install

    - name: Integration Test (Server Health Check with Polling & Cleanup)
      run: |
        # Start server in background and capture PID
        node server.js &
        SERVER_PID=$!
        
        # Poll for server availability up to 15 seconds
        STARTED=0
        for i in {1..15}; do
          if curl -s http://localhost:3000/api/ads/list > /dev/null; then
            echo "✅ Server is up and running on Node ${{ matrix.node-version }}!"
            STARTED=1
            break
          fi
          sleep 1
        done
        
        # Always terminate the background server process safely
        kill $SERVER_PID 2>/dev/null || true
        wait $SERVER_PID 2>/dev/null || true
        
        if [ $STARTED -eq 0 ]; then
          echo "❌ Server failed to start in time."
          exit 1
        fi